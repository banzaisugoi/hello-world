<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e8bc7a">
<title>Suika — Watermelon Game</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    color: #fff;
    background: #e8bc7a;
  }

  #game {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: none;
    cursor: pointer;
  }

  /* ============ Bubble base ============ */
  .bubble {
    position: fixed;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background:
      radial-gradient(circle at 30% 22%, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 40%),
      radial-gradient(circle at 50% 50%, rgba(255, 240, 200, 0.5) 0%, rgba(230, 180, 100, 0.6) 100%);
    border: 2px solid rgba(255, 255, 255, 0.9);
    box-shadow:
      inset 0 0 30px rgba(255,255,255,0.5),
      inset -8px -12px 30px rgba(150,80,20,0.2),
      0 12px 28px rgba(80,40,0,0.2);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    z-index: 2;
    pointer-events: none;
    overflow: hidden;
  }

  .bubble::before {
    content: '';
    position: absolute;
    top: 6%; left: 12%;
    width: 46%; height: 26%;
    border-radius: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0));
    filter: blur(3px);
    transform: rotate(-16deg);
    pointer-events: none;
  }

  /* ============ Score bubble ============ */
  .score-bubble { top: 22px; left: 22px; width: 186px; height: 186px; }

  .bubble-label {
    font-size: 11px;
    letter-spacing: 0.22em;
    font-weight: 900;
    color: #fff4d4;
    text-transform: uppercase;
    margin-bottom: 2px;
    text-shadow: 0 2px 4px rgba(120,60,0,0.6);
  }

  .bubble-big {
    font-size: 46px;
    font-weight: 900;
    letter-spacing: -0.04em;
    line-height: 1;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 0 rgba(140,80,20,0.4), 0 5px 12px rgba(120,60,0,0.4);
  }

  .bubble-best-label {
    font-size: 9.5px;
    letter-spacing: 0.22em;
    font-weight: 800;
    color: #ffe6b0;
    margin-top: 10px;
    text-shadow: 0 1px 2px rgba(120,60,0,0.5);
  }

  .bubble-best {
    font-size: 20px;
    font-weight: 800;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
    margin-top: 1px;
    text-shadow: 0 1px 0 rgba(140,80,20,0.4);
  }

  /* ============ Next bubble ============ */
  .next-bubble { top: 22px; right: 22px; width: 152px; height: 152px; }

  .bubble-fruit {
    width: 66px; height: 66px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 38px;
    line-height: 1;
    margin-top: 5px;
    box-shadow:
      inset 0 -5px 10px rgba(0,0,0,0.22),
      inset 0 5px 10px rgba(255,255,255,0.5),
      0 8px 16px rgba(120,60,0,0.3);
    transition: background 0.15s ease;
  }

  /* ============ Evolution ring ============ */
  .ring-panel {
    position: fixed;
    right: 26px; bottom: 26px;
    width: 200px; height: 200px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 22%, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 40%),
      radial-gradient(circle at 50% 50%, rgba(255, 240, 200, 0.3) 0%, rgba(230, 180, 100, 0.5) 100%);
    border: 2px solid rgba(255, 255, 255, 0.8);
    box-shadow:
      inset 0 0 40px rgba(255,255,255,0.4),
      inset -8px -12px 30px rgba(150,80,20,0.2),
      0 14px 32px rgba(80,40,0,0.2);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    z-index: 2;
    pointer-events: none;
  }

  .ring-label {
    position: absolute;
    top: -26px; left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 0.22em;
    font-weight: 900;
    color: #fff6dc;
    text-transform: uppercase;
    white-space: nowrap;
    text-shadow: 0 2px 6px rgba(80,40,0,0.6);
  }

  .ring-container { position: absolute; inset: 0; }

  .ring-fruit {
    position: absolute;
    width: 26px; height: 26px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 15px;
    line-height: 1;
    transform: translate(-50%, -50%);
    box-shadow:
      inset 0 -2px 4px rgba(0,0,0,0.25),
      inset 0 2px 4px rgba(255,255,255,0.5),
      0 4px 8px rgba(80,40,0,0.3);
  }

  /* ============ Corner controls ============ */
  .corner-controls {
    position: fixed;
    left: 26px; bottom: 26px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 3;
  }

  .brand {
    font-size: 18px;
    font-weight: 900;
    letter-spacing: -0.02em;
    color: #fff6dc;
    text-shadow: 0 2px 10px rgba(80,40,0,0.5);
    opacity: 0.95;
  }
  .brand .dot { color: #ffd060; }

  .mute-btn {
    font: inherit;
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.9);
    background: linear-gradient(180deg, rgba(255, 245, 220, 0.95), rgba(230, 180, 100, 0.95));
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    color: #7a4b1a;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    display: grid;
    place-items: center;
    box-shadow: 0 6px 16px rgba(80,40,0,0.25), inset 0 0 0 1px rgba(255,255,255,0.5);
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .mute-btn:hover { transform: translateY(-1px); background: #fff; }
  .mute-btn:active { transform: scale(0.95); }
  .mute-btn.muted { color: #a8834e; background: rgba(220,200,170,0.8); }

  .mute-btn.music-off {
    filter: grayscale(1);
    opacity: 0.6;
  }
  .mute-btn:disabled { cursor: default; }

  /* ============ Game over overlay ============ */
  .overlay {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: rgba(160, 110, 50, 0.6);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    z-index: 10;
    opacity: 1;
    transition: opacity 0.25s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }

  .panel {
    text-align: center;
    padding: 32px 42px 30px;
    background: linear-gradient(180deg, #fffdf3, #fdf2d0);
    border-radius: 30px;
    box-shadow: 0 24px 60px rgba(80,40,0,0.3), inset 0 0 0 2px rgba(255,255,255,0.9);
    border: 1px solid rgba(232,200,138,0.9);
  }

  .panel h1 {
    margin: 0 0 6px;
    font-size: 32px;
    color: #7a4b1a;
    letter-spacing: -0.03em;
    text-shadow: 0 2px 0 rgba(255,255,255,0.8);
  }

  .panel .sub {
    margin: 0 0 4px;
    font-size: 13px;
    color: #a88658;
    font-weight: 700;
  }

  .results {
    display: flex;
    justify-content: center;
    gap: 34px;
    margin: 20px 0 24px;
  }

  .results > div {
    display: flex;
    flex-direction: column;
    gap: 2px;
    align-items: center;
  }

  .results span {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 800;
    color: #b89868;
  }

  .results strong {
    font-size: 30px;
    font-weight: 900;
    color: #6b4a25;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 0 rgba(255,255,255,0.8);
  }

  #restartBtn {
    font: inherit;
    font-weight: 800;
    font-size: 15px;
    color: #6b3a10;
    background: linear-gradient(180deg, #ffe7a4, #f6c250);
    border: 0;
    border-radius: 999px;
    padding: 14px 38px;
    cursor: pointer;
    box-shadow: 0 10px 26px rgba(220,160,40,0.42), inset 0 -3px 0 rgba(150,90,0,0.18), inset 0 0 0 1px rgba(255,255,255,0.55);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  #restartBtn:hover { transform: translateY(-1px); box-shadow: 0 14px 30px rgba(220,160,40,0.5), inset 0 -3px 0 rgba(150,90,0,0.18); }
  #restartBtn:active { transform: translateY(1px) scale(0.98); }

  /* ============ Responsive ============ */
  @media (max-width: 900px) {
    .score-bubble { width: 150px; height: 150px; top: 16px; left: 16px; }
    .bubble-big { font-size: 36px; }
    .bubble-best { font-size: 16px; }
    .bubble-best-label { margin-top: 6px; font-size: 9px; }
    .next-bubble { width: 120px; height: 120px; top: 16px; right: 16px; }
    .bubble-fruit { width: 52px; height: 52px; font-size: 30px; }
    .ring-panel { width: 158px; height: 158px; right: 16px; bottom: 16px; }
    .ring-fruit { width: 22px; height: 22px; font-size: 13px; }
    .corner-controls { left: 16px; bottom: 16px; }
  }

  @media (max-width: 620px) {
    .score-bubble { width: 118px; height: 118px; top: 10px; left: 10px; }
    .bubble-label { font-size: 9px; letter-spacing: 0.18em; }
    .bubble-big { font-size: 26px; }
    .bubble-best { font-size: 13px; }
    .bubble-best-label { margin-top: 4px; font-size: 8px; letter-spacing: 0.16em; }
    .next-bubble { width: 92px; height: 92px; top: 10px; right: 10px; }
    .bubble-fruit { width: 40px; height: 40px; font-size: 22px; margin-top: 2px; }
    .ring-panel { width: 116px; height: 116px; right: 10px; bottom: 10px; }
    .ring-fruit { width: 18px; height: 18px; font-size: 11px; }
    .ring-label { font-size: 9px; top: -20px; }
    .corner-controls { left: 10px; bottom: 10px; gap: 8px; }
    .brand { font-size: 14px; }
    .mute-btn { width: 34px; height: 34px; font-size: 14px; }
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<!-- Score bubble -->
<div class="bubble score-bubble">
  <div class="bubble-label">Score</div>
  <div class="bubble-big" id="scoreEl">0</div>
  <div class="bubble-best-label">Best Score</div>
  <div class="bubble-best" id="bestEl">0</div>
</div>

<!-- Next fruit bubble -->
<div class="bubble next-bubble">
  <div class="bubble-label">Next</div>
  <div class="bubble-fruit" id="nextEl">🍒</div>
</div>

<!-- Evolution ring -->
<div class="ring-panel">
  <div class="ring-label">Evolution</div>
  <div class="ring-container" id="ringContainer"></div>
</div>

<!-- Corner controls -->
<div class="corner-controls">
  <button class="mute-btn" id="muteBtn" title="Toggle sound effects" aria-label="Toggle sound effects">🔊</button>
  <button class="mute-btn" id="bgmBtn" title="Music: on" aria-label="Toggle music" aria-pressed="true">🎵</button>
  <span class="brand">Suika<span class="dot">.</span></span>
</div>

<!-- Game over overlay -->
<div class="overlay hidden" id="overlay">
  <div class="panel">
    <h1>Game Over</h1>
    <p class="sub">The fruits overflowed!</p>
    <div class="results">
      <div><span>Score</span><strong id="finalScore">0</strong></div>
      <div><span>Best</span><strong id="finalBest">0</strong></div>
    </div>
    <button id="restartBtn">Play Again</button>
  </div>
</div>

<script>
(() => {
'use strict';

/* ============================================================
   POLYFILL
   ============================================================ */
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (typeof r === 'number') r = [r, r, r, r];
    const [tl, tr, br, bl] = r;
    this.moveTo(x + tl, y);
    this.lineTo(x + w - tr, y);
    this.quadraticCurveTo(x + w, y, x + w, y + tr);
    this.lineTo(x + w, y + h - br);
    this.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
    this.lineTo(x + bl, y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - bl);
    this.lineTo(x, y + tl);
    this.quadraticCurveTo(x, y, x + tl, y);
    this.closePath();
    return this;
  };
}

/* ============================================================
   CONSTANTS
   ============================================================ */
const WORLD_W = 480;
const WORLD_H = 720;
const WALL = 12;                   
const LEFT = WALL;
const RIGHT = WORLD_W - WALL;
const BOTTOM = WORLD_H - WALL;

const DROP_Y = 44;
const CLOUD_CY = -24;              // Lifted to sit on the back rim
const LINE_Y = 148;

const GRAVITY = 2400;
const RESTITUTION = 0.06;
const WALL_RESTITUTION = 0.12;
const FRICTION = 0.28;
const STEP = 1 / 120;
const ITERATIONS = 4;
const MAX_DROP_TIER = 4;
const BEST_KEY = 'suika.best.v2';

const FRUITS = [
  { name: 'Cherry',     r: 16,   emoji: '🍒', color: '#ff5c72', score: 0  },
  { name: 'Strawberry', r: 19.5, emoji: '🍓', color: '#f0384f', score: 1  },
  { name: 'Grape',      r: 23.5, emoji: '🍇', color: '#a95cf0', score: 3  },
  { name: 'Lemon',      r: 28,   emoji: '🍋', color: '#f0c419', score: 6  },
  { name: 'Orange',     r: 33.5, emoji: '🍊', color: '#ff9f1c', score: 10 },
  { name: 'Apple',      r: 40,   emoji: '🍎', color: '#e63946', score: 15 },
  { name: 'Pear',       r: 47.5, emoji: '🍐', color: '#a8c93a', score: 21 },
  { name: 'Peach',      r: 56,   emoji: '🍑', color: '#ff8b6a', score: 28 },
  { name: 'Pineapple',  r: 66,   emoji: '🍍', color: '#f0b429', score: 36 },
  { name: 'Melon',      r: 78,   emoji: '🍈', color: '#8fd94f', score: 45 },
  { name: 'Watermelon', r: 92,   emoji: '🍉', color: '#34c46b', score: 55 },
];

const DROP_WEIGHTS = [0.28, 0.24, 0.20, 0.16, 0.12];

/* ============================================================
   COLOR HELPERS
   ============================================================ */
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mixHex(a, b, t) {
  const A = hexToRgb(a), B = hexToRgb(b);
  return `rgb(${Math.round(A[0]+(B[0]-A[0])*t)},${Math.round(A[1]+(B[1]-A[1])*t)},${Math.round(A[2]+(B[2]-A[2])*t)})`;
}
function fruitGradient(hex) {
  return `radial-gradient(circle at 34% 28%, ${mixHex(hex,'#ffffff',0.55)} 0%, ${hex} 60%, ${mixHex(hex,'#000000',0.30)} 100%)`;
}

/* ============================================================
   DOM
   ============================================================ */
const canvas        = document.getElementById('game');
const ctx           = canvas.getContext('2d');
const overlay       = document.getElementById('overlay');
const scoreEl       = document.getElementById('scoreEl');
const bestEl        = document.getElementById('bestEl');
const nextEl        = document.getElementById('nextEl');
const finalScoreEl  = document.getElementById('finalScore');
const finalBestEl   = document.getElementById('finalBest');
const restartBtn    = document.getElementById('restartBtn');
const muteBtn       = document.getElementById('muteBtn');
const bgmBtn        = document.getElementById('bgmBtn');
const ringContainer = document.getElementById('ringContainer');

/* ============================================================
   AUDIO (sound effects)
   ============================================================ */
let audioCtx = null;
let muted = false;

function beep(freq, dur = 0.12, type = 'sine', vol = 0.12) {
  if (muted) return;
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  } catch (_) {}
}

muteBtn.addEventListener('click', () => {
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
  muteBtn.classList.toggle('muted', muted);
});

/* ============================================================
   BGM (background music)
   ============================================================ */
const BGM_SRC = 'suika_BGM.mp3';
const BGM_KEY = 'suika.bgm.v1';
const BGM_VOLUME = 0.35;

let bgmOn = true;
try { bgmOn = localStorage.getItem(BGM_KEY) !== '0'; } catch (_) {}

let bgmReady = true;

const bgm = new Audio();
bgm.src = BGM_SRC;
bgm.loop = true;
bgm.preload = 'auto';
bgm.volume = BGM_VOLUME;

bgm.addEventListener('error', () => {
  bgmReady = false;
  bgmBtn.disabled = true;
  bgmBtn.title = 'Music unavailable (suika_BGM.mp3 not found)';
  bgmBtn.classList.add('music-off');
});

function syncBgmBtn() {
  bgmBtn.textContent = '🎵';
  bgmBtn.classList.toggle('music-off', !bgmOn || !bgmReady);
  bgmBtn.title = bgmOn ? 'Music: on' : 'Music: off';
  bgmBtn.setAttribute('aria-pressed', bgmOn ? 'true' : 'false');
}

function playBgm() {
  if (!bgmOn || !bgmReady) return;
  const p = bgm.play();
  if (p && typeof p.catch === 'function') p.catch(() => {});
}

function pauseBgm() {
  try { bgm.pause(); } catch (_) {}
}

function unlockBgm() {
  playBgm();
  window.removeEventListener('pointerdown', unlockBgm);
  window.removeEventListener('keydown', unlockBgm);
  window.removeEventListener('touchstart', unlockBgm);
}

bgmBtn.addEventListener('click', (e) => {
  e.preventDefault();
  e.stopPropagation();
  bgmOn = !bgmOn;
  try { localStorage.setItem(BGM_KEY, bgmOn ? '1' : '0'); } catch (_) {}
  syncBgmBtn();
  if (bgmOn) playBgm();
  else pauseBgm();
});

function initBgm() {
  syncBgmBtn();
  if (!bgmOn || !bgmReady) return;
  playBgm();
  window.addEventListener('pointerdown', unlockBgm, { passive: true });
  window.addEventListener('keydown', unlockBgm);
  window.addEventListener('touchstart', unlockBgm, { passive: true });
}

/* ============================================================
   SPRITES
   ============================================================ */
const spriteCache = [];

function makeSprite(tier) {
  const f = FRUITS[tier];
  const SS = 2.5;
  const pad = 1.35;
  const R = f.r;
  const size = Math.ceil(R * 2 * pad * SS);

  const cv = document.createElement('canvas');
  cv.width = size;
  cv.height = size;
  const g = cv.getContext('2d');

  const c = size / 2;
  const r = R * SS;

  const light = mixHex(f.color, '#ffffff', 0.52);
  const dark  = mixHex(f.color, '#000000', 0.40);

  // Shadow
  g.save();
  g.beginPath();
  g.arc(c, c + r * 0.05, r * 0.97, 0, Math.PI * 2);
  g.shadowColor = 'rgba(80,50,10,0.32)';
  g.shadowBlur = r * 0.30;
  g.shadowOffsetY = r * 0.10;
  g.fillStyle = dark;
  g.fill();
  g.restore();

  // Body
  const grad = g.createRadialGradient(c - r * 0.34, c - r * 0.40, r * 0.05, c, c, r * 1.08);
  grad.addColorStop(0, light);
  grad.addColorStop(0.5, f.color);
  grad.addColorStop(1, dark);
  g.beginPath();
  g.arc(c, c, r, 0, Math.PI * 2);
  g.fillStyle = grad;
  g.fill();

  // Emoji face
  g.font = `${r * 1.5}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif`;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(f.emoji, c, c + r * 0.05);

  // Gloss
  g.beginPath();
  g.ellipse(c - r * 0.32, c - r * 0.46, r * 0.30, r * 0.17, -0.6, 0, Math.PI * 2);
  g.fillStyle = 'rgba(255,255,255,0.34)';
  g.fill();

  return { canvas: cv, pad };
}

function getSprite(tier) {
  if (!spriteCache[tier]) spriteCache[tier] = makeSprite(tier);
  return spriteCache[tier];
}

/* ============================================================
   LAYOUT
   ============================================================ */
const layout = {
  cw: 0, ch: 0, dpr: 1,
  bowlX: 0, bowlY: 0, bw: 0, bh: 0,
  scale: 1,
};

function updateLayout() {
  const cw = window.innerWidth;
  const ch = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width  = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width  = '100%';
  canvas.style.height = '100%';

  const isNarrow = cw < 700;
  const topMargin = isNarrow ? 120 : 100;
  const botMargin = isNarrow ? 30  : 30;

  const availH = ch - topMargin - botMargin;
  const maxBW = Math.min(cw - 60, 520);

  const aspect = WORLD_W / WORLD_H;
  let bh = availH;
  let bw = bh * aspect;
  if (bw > maxBW) { bw = maxBW; bh = bw / aspect; }

  const maxBH = 780;
  if (bh > maxBH) { bh = maxBH; bw = bh * aspect; }

  const bowlX = (cw - bw) / 2;
  const bowlY = topMargin + (availH - bh) / 2;

  Object.assign(layout, {
    cw, ch, dpr,
    bowlX, bowlY, bw, bh,
    scale: bh / WORLD_H,
  });

  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  buildRing();
}

/* ============================================================
   EVOLUTION RING
   ============================================================ */
function buildRing() {
  const size = ringContainer.clientWidth || ringContainer.offsetWidth;
  if (!size) return;

  ringContainer.innerHTML = '';
  const R = size * 0.34;
  const n = FRUITS.length;
  const fruitPx = Math.max(14, Math.round(size * 0.135));

  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (i / n) * Math.PI * 2;
    const x = Math.cos(a) * R;
    const y = Math.sin(a) * R;

    const d = document.createElement('div');
    d.className = 'ring-fruit';
    d.style.left = `calc(50% + ${x}px)`;
    d.style.top  = `calc(50% + ${y}px)`;
    d.style.width  = fruitPx + 'px';
    d.style.height = fruitPx + 'px';
    d.style.fontSize = Math.round(fruitPx * 0.6) + 'px';
    d.style.background = fruitGradient(FRUITS[i].color);
    d.textContent = FRUITS[i].emoji;
    d.title = FRUITS[i].name;
    ringContainer.appendChild(d);
  }
}

/* ============================================================
   GAME STATE
   ============================================================ */
let bodies = [];
let particles = [];
let score = 0;
let best = Number(localStorage.getItem(BEST_KEY) || 0) || 0;
let state = 'playing';
let dropX = WORLD_W / 2;
let currentTier = 0;
let nextTier = 0;
let ready = true;
let readyTimer = 0;
let dangerTime = 0;
let shake = 0;

class Body {
  constructor(x, y, tier) {
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.tier = tier;
    this.r = FRUITS[tier].r;
    this.m = this.r * this.r;
    this.age = 0;
    this.pop = 0;
  }
}

/* ============================================================
   SETUP
   ============================================================ */
function randTier() {
  let x = Math.random();
  for (let i = 0; i < DROP_WEIGHTS.length; i++) {
    if (x < DROP_WEIGHTS[i]) return i;
    x -= DROP_WEIGHTS[i];
  }
  return MAX_DROP_TIER;
}

function clampDropX() {
  const r = FRUITS[currentTier].r;
  const min = LEFT + r + 1;
  const max = RIGHT - r - 1;
  if (dropX < min) dropX = min;
  if (dropX > max) dropX = max;
}

function reset() {
  bodies.length = 0;
  particles.length = 0;
  score = 0;
  state = 'playing';
  dropX = WORLD_W / 2;
  currentTier = randTier();
  nextTier = randTier();
  ready = true;
  readyTimer = 0;
  dangerTime = 0;
  shake = 0;
  clampDropX();
  overlay.classList.add('hidden');
  updateHud();
}

function updateHud() {
  scoreEl.textContent = score;
  bestEl.textContent = best;
  const f = FRUITS[nextTier];
  nextEl.style.background = fruitGradient(f.color);
  nextEl.textContent = f.emoji;
  nextEl.style.fontSize = Math.round(15 + f.r * 0.28) + 'px';
}

function addScore(n) {
  score += n;
  if (score > best) {
    best = score;
    try { localStorage.setItem(BEST_KEY, String(best)); } catch (_) {}
  }
  scoreEl.textContent = score;
  bestEl.textContent = best;
}

/* ============================================================
   PHYSICS
   ============================================================ */
function physics(dt) {
  const drag = 0.9995;

  for (let i = 0; i < bodies.length; i++) {
    const b = bodies[i];
    b.vy += GRAVITY * dt;
    b.vx *= drag;
    b.vy *= drag;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.age += dt;
    if (b.pop > 0) b.pop = Math.max(0, b.pop - dt * 5);
  }

  for (let it = 0; it < ITERATIONS; it++) {
    solveWalls();
    solvePairs();
  }

  for (let i = 0; i < bodies.length; i++) {
    const b = bodies[i];
    if (b.y + b.r >= BOTTOM - 0.6) b.vx *= 0.99;
  }
}

function solveWalls() {
  for (let i = 0; i < bodies.length; i++) {
    const b = bodies[i];
    if (b.x - b.r < LEFT) {
      b.x = LEFT + b.r;
      if (b.vx < 0) b.vx *= -WALL_RESTITUTION;
    }
    if (b.x + b.r > RIGHT) {
      b.x = RIGHT - b.r;
      if (b.vx > 0) b.vx *= -WALL_RESTITUTION;
    }
    if (b.y + b.r > BOTTOM) {
      b.y = BOTTOM - b.r;
      if (b.vy > 0) b.vy *= -WALL_RESTITUTION;
    }
  }
}

function solvePairs() {
  const n = bodies.length;
  for (let i = 0; i < n; i++) {
    const a = bodies[i];
    for (let j = i + 1; j < n; j++) {
      const b = bodies[j];

      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const rs = a.r + b.r;
      const d2 = dx * dx + dy * dy;
      if (d2 >= rs * rs || d2 === 0) continue;

      const d = Math.sqrt(d2);
      const nx = dx / d;
      const ny = dy / d;

      const invA = 1 / a.m;
      const invB = 1 / b.m;
      const invSum = invA + invB;

      const pen = rs - d;
      const slop = 0.5;
      const corr = (Math.max(pen - slop, 0) * 0.7) / invSum;
      a.x -= nx * corr * invA;
      a.y -= ny * corr * invA;
      b.x += nx * corr * invB;
      b.y += ny * corr * invB;

      const rvx = b.vx - a.vx;
      const rvy = b.vy - a.vy;
      const vn = rvx * nx + rvy * ny;
      if (vn > 0) continue;

      const jn = (-(1 + RESTITUTION) * vn) / invSum;
      a.vx -= nx * jn * invA;
      a.vy -= ny * jn * invA;
      b.vx += nx * jn * invB;
      b.vy += ny * jn * invB;

      const tx = -ny;
      const ty = nx;
      const vt = rvx * tx + rvy * ty;
      let jt = -vt / invSum;
      const maxF = jn * FRICTION;
      if (jt > maxF) jt = maxF;
      else if (jt < -maxF) jt = -maxF;

      a.vx -= tx * jt * invA;
      a.vy -= ty * jt * invA;
      b.vx += tx * jt * invB;
      b.vy += ty * jt * invB;
    }
  }
}

/* ============================================================
   MERGING
   ============================================================ */
function handleMerges() {
  if (bodies.length < 2) return;

  const dead = new Set();
  const created = [];

  for (let i = 0; i < bodies.length; i++) {
    const a = bodies[i];
    if (dead.has(a)) continue;

    for (let j = i + 1; j < bodies.length; j++) {
      const b = bodies[j];
      if (dead.has(b)) continue;
      if (b.tier !== a.tier) continue;

      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const rs = a.r + b.r + 1.2;
      if (dx * dx + dy * dy > rs * rs) continue;

      dead.add(a);
      dead.add(b);
      const nb = mergeInto(a, b);
      if (nb) created.push(nb);
      break;
    }
  }

  if (dead.size) {
    bodies = bodies.filter(b => !dead.has(b));
    for (let i = 0; i < created.length; i++) bodies.push(created[i]);
  }
}

function mergeInto(a, b) {
  const tier = a.tier;
  const mx = (a.x + b.x) * 0.5;
  const my = (a.y + b.y) * 0.5;
  const mvx = (a.vx + b.vx) * 0.5;
  const mvy = (a.vy + b.vy) * 0.5;

  if (tier >= FRUITS.length - 1) {
    addScore(FRUITS[tier].score * 2 + 40);
    burst(mx, my, FRUITS[tier].color, 26, 1.4);
    shake = Math.min(14, shake + 10);
    beep(180, 0.28, 'triangle', 0.16);
    beep(320, 0.35, 'sine', 0.10);
    return null;
  }

  const nt = tier + 1;
  const nb = new Body(mx, my, nt);
  nb.vx = mvx;
  nb.vy = mvy;
  nb.pop = 1;
  nb.age = 0;

  addScore(FRUITS[nt].score);
  burst(mx, my, FRUITS[nt].color, 10 + nt, 0.8 + nt * 0.04);
  shake = Math.min(10, shake + 1 + nt * 0.5);

  beep(260 + nt * 58, 0.11, 'triangle', 0.09);

  return nb;
}

/* ============================================================
   PARTICLES
   ============================================================ */
function burst(x, y, color, count, power) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const sp = (70 + Math.random() * 230) * power;
    particles.push({
      x, y,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp - 70,
      r: 1.8 + Math.random() * 4.2,
      life: 0.45 + Math.random() * 0.45,
      maxLife: 0.9,
      color,
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vy += 1300 * dt;
    p.vx *= 0.99;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

/* ============================================================
   DANGER / GAME OVER
   ============================================================ */
function checkDanger(dt) {
  let danger = false;
  for (let i = 0; i < bodies.length; i++) {
    const b = bodies[i];
    if (b.age > 0.9 && b.y - b.r < LINE_Y) { danger = true; break; }
  }

  if (danger) {
    dangerTime += dt;
    if (dangerTime >= 2.0) endGame();
  } else if (dangerTime > 0) {
    dangerTime = Math.max(0, dangerTime - dt * 2.5);
  }
}

function endGame() {
  if (state === 'over') return;
  state = 'over';
  dangerTime = 0;

  if (score > best) {
    best = score;
    try { localStorage.setItem(BEST_KEY, String(best)); } catch (_) {}
  }

  finalScoreEl.textContent = score;
  finalBestEl.textContent = best;
  bestEl.textContent = best;

  overlay.classList.remove('hidden');

  beep(320, 0.4, 'sawtooth', 0.10);
  setTimeout(() => beep(220, 0.5, 'sawtooth', 0.10), 120);
}

/* ============================================================
   DROPPING
   ============================================================ */
function drop() {
  if (state !== 'playing' || !ready) return;

  clampDropX();

  const b = new Body(dropX, DROP_Y, currentTier);
  b.vy = 60;
  bodies.push(b);

  ready = false;
  readyTimer = 0.40;

  currentTier = nextTier;
  nextTier = randTier();
  clampDropX();
  updateHud();

  beep(520, 0.06, 'sine', 0.05);
}

/* ============================================================
   UPDATE
   ============================================================ */
function update(dt) {
  if (state === 'playing') {
    physics(dt);
    handleMerges();
    checkDanger(dt);

    if (!ready) {
      readyTimer -= dt;
      if (readyTimer <= 0) ready = true;
    }
  }

  updateParticles(dt);

  if (shake > 0.05) shake *= Math.pow(0.0008, dt);
  else shake = 0;
}

/* ============================================================
   RENDER
   ============================================================ */
function render(time) {
  const { dpr, bowlX, bowlY, bw, bh, scale } = layout;
  
  const cw = canvas.width / dpr;
  const ch = canvas.height / dpr;

  // 1) Reset + full-screen background (SCALED BY DPR to prevent cut-offs)
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cw, ch);
  drawBackground(cw, ch);

  // 2) World transform (world coordinates -> bowl rect on screen)
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * bowlX, dpr * bowlY);

  // Screen shake
  ctx.save();
  if (shake > 0.1) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }

  // Draw the glass bowl's back and inner shadow
  drawBowlBackAndSides();

  // Danger line
  drawDangerLine(time);

  // Fruits & Particles (Drawn in front, bright and full color)
  for (let i = 0; i < bodies.length; i++) drawBody(bodies[i]);

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const a = Math.max(0, Math.min(1, p.life / p.maxLife));
    ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Draw the front rim (frames the fruits inside the 3D box)
  drawBowlFront();

  // Cloud (above bowl) + held-fruit preview
  if (state === 'playing') {
    const cloudR = FRUITS[currentTier].r;
    const cloudW = cloudR * 2 + 78;
    const cloudH = 34;
    drawCloud(dropX, CLOUD_CY, cloudW, cloudH);

    if (ready) {
      drawGuideLine();
      drawHeldFruit();
    }
  }

  ctx.restore();
}

/* ---------- Background ---------- */
function drawBackground(cw, ch) {
  // Wall
  const g = ctx.createLinearGradient(0, 0, 0, ch * 0.55);
  g.addColorStop(0, '#e8bc7a');
  g.addColorStop(1, '#d19b5d');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, cw, ch);

  // Floor Base
  const floorY = ch * 0.55;
  ctx.fillStyle = '#f2d5a1';
  ctx.fillRect(0, floorY, cw, ch - floorY);

  // Perspective Checkered Floor
  const vx = cw / 2;
  const cols = 15;
  const rows = 12;

  for (let r = 0; r < rows; r++) {
    const t1 = r / rows;
    const t2 = (r + 1) / rows;
    
    // Exponential spacing for depth
    const y1 = floorY + (ch - floorY) * (t1 * t1);
    const y2 = floorY + (ch - floorY) * (t2 * t2);
    
    const scale1 = t1;
    const scale2 = t2;
    
    for (let c = -cols; c <= cols; c++) {
      if ((r + c) % 2 === 0) continue;
      
      const tileW = 120; // Much larger tiles for a more pronounced perspective
      
      const x1_1 = vx + (c * tileW) * scale1;
      const x1_2 = vx + ((c + 1) * tileW) * scale1;
      
      const x2_1 = vx + (c * tileW) * scale2;
      const x2_2 = vx + ((c + 1) * tileW) * scale2;

      ctx.fillStyle = 'rgba(210, 170, 110, 0.35)';
      ctx.beginPath();
      ctx.moveTo(x1_1, y1);
      ctx.lineTo(x1_2, y1);
      ctx.lineTo(x2_2, y2);
      ctx.lineTo(x2_1, y2);
      ctx.fill();
    }
  }

  // Soft shadow cast from the wall to the floor
  const shadowGrad = ctx.createLinearGradient(0, floorY, 0, floorY + 80);
  shadowGrad.addColorStop(0, 'rgba(100, 60, 20, 0.4)');
  shadowGrad.addColorStop(1, 'rgba(100, 60, 20, 0)');
  ctx.fillStyle = shadowGrad;
  ctx.fillRect(0, floorY, cw, 80);

  // Vignette for depth
  const v = ctx.createRadialGradient(cw * 0.5, ch * 0.5, Math.min(cw, ch) * 0.4, cw * 0.5, ch * 0.5, Math.max(cw, ch) * 0.8);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(80, 40, 0, 0.3)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, cw, ch);
}

/* ---------- 3D Glass Bowl ---------- */
const P_X = 24; // Perspective X offset
const P_Y = 20; // Perspective Y offset

function drawBowlBackAndSides() {
  // Back inner wall
  ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
  ctx.beginPath();
  ctx.moveTo(WALL + P_X, -P_Y);
  ctx.lineTo(WORLD_W - WALL - P_X, -P_Y);
  ctx.lineTo(WORLD_W - WALL - P_X, WORLD_H - WALL);
  ctx.lineTo(WALL + P_X, WORLD_H - WALL);
  ctx.fill();

  // Left side wall
  ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.beginPath();
  ctx.moveTo(WALL, 0);
  ctx.lineTo(WALL + P_X, -P_Y);
  ctx.lineTo(WALL + P_X, WORLD_H - WALL);
  ctx.lineTo(WALL, WORLD_H - WALL);
  ctx.fill();

  // Right side wall
  ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.beginPath();
  ctx.moveTo(WORLD_W - WALL, 0);
  ctx.lineTo(WORLD_W - WALL - P_X, -P_Y);
  ctx.lineTo(WORLD_W - WALL - P_X, WORLD_H - WALL);
  ctx.lineTo(WORLD_W - WALL, WORLD_H - WALL);
  ctx.fill();

  // Top back rim (drawn behind everything to create the open box effect)
  const rimGrad = ctx.createLinearGradient(0, -P_Y, 0, 0);
  rimGrad.addColorStop(0, '#fae3b4');
  rimGrad.addColorStop(1, '#e8b86e');
  
  ctx.strokeStyle = rimGrad;
  ctx.lineWidth = WALL;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(WALL, 0);
  ctx.lineTo(WALL + P_X, -P_Y);
  ctx.lineTo(WORLD_W - WALL - P_X, -P_Y);
  ctx.lineTo(WORLD_W - WALL, 0);
  ctx.stroke();
}

function drawBowlFront() {
  // Thick front rim creating the 3D frame
  const rimGrad = ctx.createLinearGradient(0, 0, WORLD_W, WORLD_H);
  rimGrad.addColorStop(0, '#fae3b4');
  rimGrad.addColorStop(0.5, '#f0c98c');
  rimGrad.addColorStop(1, '#e0b06d');
  
  ctx.strokeStyle = rimGrad;
  ctx.lineWidth = WALL;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.roundRect(WALL/2, WALL/2, WORLD_W - WALL, WORLD_H - WALL, [16, 16, 24, 24]);
  ctx.stroke();

  // Inner white highlight on the rim for a glassy edge
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(WALL - 1, WALL - 1, WORLD_W - WALL * 2 + 2, WORLD_H - WALL * 2 + 2, [14, 14, 22, 22]);
  ctx.stroke();
}

/* ---------- Danger line ---------- */
function drawDangerLine(time) {
  const ratio = Math.min(1, dangerTime / 2.0);
  const pulse = 0.5 + 0.5 * Math.sin(time / 130);

  ctx.save();
  ctx.setLineDash([9, 11]);
  ctx.lineWidth = 2.5;

  if (ratio > 0.001) {
    ctx.strokeStyle = `rgba(230, 70, 60, ${0.4 + 0.6 * ratio * pulse})`;
    ctx.shadowColor = 'rgba(230, 70, 60, 0.8)';
    ctx.shadowBlur = 12 * ratio;
  } else {
    ctx.strokeStyle = 'rgba(180, 140, 80, 0.35)';
  }

  ctx.beginPath();
  ctx.moveTo(LEFT + 4, LINE_Y);
  ctx.lineTo(RIGHT - 4, LINE_Y);
  ctx.stroke();
  ctx.restore();
}

/* ---------- Cloud ---------- */
function drawCloud(cx, cy, w, h) {
  const leftX = cx - w / 2;
  const baseY = cy + h * 0.55;

  ctx.save();
  ctx.shadowColor = 'rgba(160, 120, 60, 0.3)';
  ctx.shadowBlur = 14;
  ctx.shadowOffsetY = 6;

  // Golden gradient for the cloud
  const cloudGrad = ctx.createLinearGradient(0, cy - h, 0, baseY);
  cloudGrad.addColorStop(0, '#fff6d4');
  cloudGrad.addColorStop(1, '#ffd77a');
  
  ctx.fillStyle = cloudGrad;
  ctx.beginPath();
  
  // Flat core
  ctx.rect(leftX, cy - h * 0.05, w, baseY - (cy - h * 0.05));
  
  // Fluffy bumps
  const bumpSpecs = [
    { t: 0.14, r: 0.38, yOff:  0.08 },
    { t: 0.37, r: 0.55, yOff: -0.16 },
    { t: 0.63, r: 0.50, yOff: -0.06 },
    { t: 0.86, r: 0.36, yOff:  0.08 },
  ];
  for (const spec of bumpSpecs) {
    const bx = leftX + w * spec.t;
    const by = cy + h * spec.yOff;
    const br = h * spec.r;
    ctx.moveTo(bx + br, by);
    ctx.arc(bx, by, br, 0, Math.PI * 2);
  }
  ctx.fill();

  // Cute face on the cloud
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#8b5a2b'; 
  ctx.beginPath();
  ctx.arc(cx - 6, cy - 2, 2.5, 0, Math.PI * 2);
  ctx.arc(cx + 6, cy - 2, 2.5, 0, Math.PI * 2);
  ctx.fill();
  
  // Smile
  ctx.strokeStyle = '#8b5a2b';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy + 1, 5, 0.1 * Math.PI, 0.9 * Math.PI);
  ctx.stroke();

  ctx.restore();
}

/* ---------- Guide line ---------- */
function drawGuideLine() {
  const r = FRUITS[currentTier].r;
  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.setLineDash([6, 12]);
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
  ctx.shadowColor = 'rgba(120, 80, 30, 0.5)';
  ctx.shadowBlur = 4;
  
  ctx.beginPath();
  ctx.moveTo(dropX, DROP_Y + r + 6);
  ctx.lineTo(dropX, BOTTOM - 8);
  ctx.stroke();
  ctx.restore();
}

/* ---------- Held fruit ---------- */
function drawHeldFruit() {
  const tier = currentTier;
  const sprite = getSprite(tier);
  const half = FRUITS[tier].r * sprite.pad;
  ctx.save();
  ctx.globalAlpha = 0.98;
  ctx.drawImage(sprite.canvas, dropX - half, DROP_Y - half, half * 2, half * 2);
  ctx.restore();
}

/* ---------- Fruit ---------- */
function drawBody(b) {
  const sprite = getSprite(b.tier);
  const scaleFactor = 1 + 0.34 * b.pop;
  const half = FRUITS[b.tier].r * sprite.pad * scaleFactor;
  ctx.drawImage(sprite.canvas, b.x - half, b.y - half, half * 2, half * 2);
}

/* ============================================================
   INPUT
   ============================================================ */
function pointerToWorldX(clientX) {
  const { bowlX, bw } = layout;
  if (bw <= 0) return WORLD_W / 2;
  return ((clientX - bowlX) / bw) * WORLD_W;
}

canvas.addEventListener('pointermove', (e) => {
  if (state !== 'playing') return;
  dropX = pointerToWorldX(e.clientX);
  clampDropX();
}, { passive: true });

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (state !== 'playing') return;
  dropX = pointerToWorldX(e.clientX);
  clampDropX();
  drop();
});

canvas.addEventListener('contextmenu', (e) => e.preventDefault());

window.addEventListener('keydown', (e) => {
  if (state !== 'playing') {
    if (e.key === 'Enter' || e.key === ' ') { reset(); e.preventDefault(); }
    return;
  }

  const step = 16;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
    dropX -= step; clampDropX(); e.preventDefault();
  } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
    dropX += step; clampDropX(); e.preventDefault();
  } else if (e.key === ' ' || e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
    drop(); e.preventDefault();
  }
});

restartBtn.addEventListener('click', reset);
window.addEventListener('resize', updateLayout);
window.addEventListener('orientationchange', () => setTimeout(updateLayout, 120));

/* ============================================================
   MAIN LOOP
   ============================================================ */
let lastTime = performance.now();
let accumulator = 0;

function loop(now) {
  requestAnimationFrame(loop);

  let dt = (now - lastTime) / 1000;
  lastTime = now;

  if (dt > 0.25) dt = 0.25;
  if (dt < 0) dt = 0;

  accumulator += dt;

  let guard = 0;
  while (accumulator >= STEP && guard++ < 30) {
    update(STEP);
    accumulator -= STEP;
  }
  if (guard >= 30) accumulator = 0;

  render(now);
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    lastTime = performance.now();
    accumulator = 0;
    if (bgmOn) playBgm();
  }
});

/* ============================================================
   BOOT
   ============================================================ */
function boot() {
  updateLayout();
  reset();
  initBgm();
  requestAnimationFrame(() => {
    updateLayout();
    requestAnimationFrame(() => {
      lastTime = performance.now();
      loop(performance.now());
    });
  });
}

if (document.readyState === 'complete' || document.readyState === 'interactive') {
  boot();
} else {
  window.addEventListener('DOMContentLoaded', boot);
}

})();
</script>
