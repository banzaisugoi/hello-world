<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Sudoku</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --ink: #1e293b;
    --muted: #64748b;
    --line: #cbd5e1;
    --line-strong: #334155;
    --accent: #2563eb;
    --accent-2: #4f46e5;
    --user: #2563eb;
    --err: #e11d48;
  }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 24px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: #eef2f9;
    background-image:
      radial-gradient(1200px 600px at 8% -12%, #dbe7fb 0%, rgba(219,231,251,0) 60%),
      radial-gradient(900px 520px at 112% 112%, #e6e0fb 0%, rgba(230,224,251,0) 55%);
    -webkit-font-smoothing: antialiased;
  }

  .app { width: 100%; max-width: 880px; }

  /* ---------------- Top bar ---------------- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }

  .brand {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-right: auto;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .seg {
    display: flex;
    gap: 2px;
    padding: 4px;
    background: #e2e8f0;
    border-radius: 12px;
  }
  .seg button {
    border: 0;
    background: transparent;
    padding: 8px 15px;
    border-radius: 9px;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    color: #475569;
    cursor: pointer;
    transition: 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .seg button:hover { color: var(--ink); }
  .seg button.on {
    background: #fff;
    color: var(--accent);
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.14);
  }

  .newgame {
    border: 0;
    padding: 11px 20px;
    border-radius: 12px;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    cursor: pointer;
    box-shadow: 0 6px 16px -6px rgba(37, 99, 235, 0.75);
    transition: 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .newgame:hover { transform: translateY(-1px); box-shadow: 0 9px 22px -6px rgba(37, 99, 235, 0.85); }
  .newgame:active { transform: translateY(0); }

  /* ---------------- Layout ---------------- */
  .main { display: flex; gap: 22px; align-items: flex-start; }
  .board-area { flex: 1 1 auto; min-width: 0; }
  .board-wrap { position: relative; width: min(100%, 540px); margin: 0 auto; }

  /* ---------------- Board ---------------- */
  .board {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(9, 1fr);
    background: #fff;
    border: 3px solid var(--line-strong);
    border-radius: 12px;
    overflow: hidden;
    container-type: inline-size;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    box-shadow: 0 18px 40px -18px rgba(30, 41, 59, 0.55), 0 2px 6px rgba(30, 41, 59, 0.06);
  }

  .cell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background-color 0.12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .cell:nth-child(9n) { border-right: 0; }
  .cell:nth-child(n + 73) { border-bottom: 0; }
  .cell.br { border-right: 2px solid var(--line-strong); }
  .cell.bb { border-bottom: 2px solid var(--line-strong); }

  /* Cell states — order matters */
  .cell.given { background: #f4f7fb; }
  .cell.peer { background: #e9f0fc; }
  .cell.same { background: #cfe0fb; }
  .cell.selected { background: #b6d2fb; box-shadow: inset 0 0 0 2px var(--accent); }
  .cell.error { background: #ffe2e6; }

  .val {
    font-size: 22px;
    font-size: 6.4cqw;
    font-weight: 600;
    line-height: 1;
    color: var(--user);
    transition: color 0.12s;
  }
  .cell.given .val { color: var(--ink); font-weight: 700; }
  .cell.error .val { color: var(--err); }

  .notes {
    position: absolute;
    inset: 0;
    display: none;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 4%;
    pointer-events: none;
  }
  .notes.show { display: grid; }
  .notes i {
    display: flex;
    align-items: center;
    justify-content: center;
    font-style: normal;
    font-weight: 600;
    font-size: 9px;
    font-size: 2.45cqw;
    line-height: 1;
    color: #7c8ba3;
    border-radius: 4px;
  }
  .notes i.hl { color: var(--accent); background: #dbeafe; }

  /* ---------------- Overlays ---------------- */
  .loader, .win {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    z-index: 5;
  }
  .loader {
    flex-direction: column;
    gap: 12px;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(3px);
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
  }
  .loader.show { display: flex; }
  .spinner {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 3px solid #dbeafe;
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .win {
    background: rgba(255, 255, 255, 0.86);
    backdrop-filter: blur(5px);
    z-index: 6;
  }
  .win.show { display: flex; }
  .win-card { text-align: center; animation: pop 0.32s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes pop { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .win-card h2 { margin: 0 0 6px; font-size: 26px; letter-spacing: -0.02em; }
  .win-card p { margin: 0 0 16px; color: var(--muted); font-size: 14px; font-weight: 600; }
  .win-card button {
    border: 0;
    padding: 11px 22px;
    border-radius: 12px;
    font: inherit;
    font-weight: 600;
    font-size: 14px;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    cursor: pointer;
    box-shadow: 0 6px 16px -6px rgba(37, 99, 235, 0.75);
  }

  /* ---------------- Side panel ---------------- */
  .panel {
    flex: 0 0 252px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 8px 4px;
    text-align: center;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
  }
  .stat .k {
    display: block;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .stat .v {
    display: block;
    margin-top: 3px;
    font-size: 16px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .modes button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 11px 6px;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
    background: #fff;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    color: #475569;
    cursor: pointer;
    transition: 0.15s;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    -webkit-tap-highlight-color: transparent;
  }
  .modes button span { font-size: 15px; line-height: 1; }
  .modes button:hover { border-color: #c7d7f5; }
  .modes button.on {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: transparent;
    color: #fff;
    box-shadow: 0 6px 16px -8px rgba(37, 99, 235, 0.95);
  }

  .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .numpad button {
    position: relative;
    aspect-ratio: 1.35 / 1;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
    background: #fff;
    font: inherit;
    font-size: 23px;
    font-weight: 600;
    color: var(--accent);
    cursor: pointer;
    transition: 0.12s;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
    -webkit-tap-highlight-color: transparent;
  }
  .numpad button:hover { background: #f2f7ff; border-color: #c7d7f5; transform: translateY(-1px); }
  .numpad button:active { transform: translateY(0); }
  .numpad button.done { opacity: 0.35; }
  .numpad button .cnt {
    position: absolute;
    right: 7px;
    bottom: 5px;
    font-size: 10px;
    font-weight: 600;
    color: #9aa8bd;
  }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .actions button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 11px 6px;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
    background: #fff;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    color: #475569;
    cursor: pointer;
    transition: 0.15s;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    -webkit-tap-highlight-color: transparent;
  }
  .actions button:hover { border-color: #c7d7f5; color: var(--accent); }
  .actions button span { font-size: 15px; line-height: 1; }

  /* ---------------- Responsive ---------------- */
  @media (max-width: 800px) {
    body { align-items: flex-start; padding: 16px 12px 32px; }
    .main { flex-direction: column; }
    .panel { flex: 1 1 auto; width: 100%; }
    .numpad { grid-template-columns: repeat(9, 1fr); gap: 6px; }
    .numpad button { aspect-ratio: 1 / 1; font-size: 18px; border-radius: 10px; }
    .numpad button .cnt { right: 3px; bottom: 2px; font-size: 8px; }
    .stats { grid-template-columns: repeat(3, 1fr); }
    .modes, .actions { grid-template-columns: 1fr 1fr; }
    .brand { font-size: 22px; }
  }

  @media (max-width: 420px) {
    .seg button { padding: 7px 10px; font-size: 13px; }
    .newgame { padding: 10px 14px; font-size: 13px; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">Sudoku</div>
    <div class="seg" id="difficulty">
      <button data-diff="easy" class="on">Easy</button>
      <button data-diff="normal">Normal</button>
      <button data-diff="hard">Hard</button>
    </div>
    <button class="newgame" id="newGame">New Game</button>
  </header>

  <main class="main">
    <div class="board-area">
      <div class="board-wrap">
        <div class="board" id="board"></div>
        <div class="loader" id="loader">
          <div class="spinner"></div>
          <span>Generating puzzle…</span>
        </div>
        <div class="win" id="win">
          <div class="win-card">
            <h2>Solved! 🎉</h2>
            <p id="winTime"></p>
            <button id="winNew">Play again</button>
          </div>
        </div>
      </div>
    </div>

    <aside class="panel">
      <div class="stats">
        <div class="stat"><span class="k">Time</span><span class="v" id="time">00:00</span></div>
        <div class="stat"><span class="k">Mistakes</span><span class="v" id="mistakes">0</span></div>
        <div class="stat"><span class="k">Level</span><span class="v" id="diffLabel">Easy</span></div>
      </div>

      <div class="modes">
        <button id="penBtn" class="on"><span>✏️</span>Pen</button>
        <button id="pencilBtn"><span>✎</span>Pencil</button>
      </div>

      <div class="numpad" id="numpad"></div>

      <div class="actions">
        <button id="eraseBtn"><span>⌫</span>Erase</button>
        <button id="hintBtn"><span>💡</span>Hint</button>
      </div>
    </aside>
  </main>
</div>

<script>
(function () {
  "use strict";

  /* =========================================================
     SUDOKU ENGINE
     ========================================================= */

  const ALL = 0x1FF; // bits 0..8 -> digits 1..9

  function boxOf(i) {
    const r = (i / 9) | 0, c = i % 9;
    return ((r / 3) | 0) * 3 + ((c / 3) | 0);
  }

  function popcount(x) {
    let c = 0;
    while (x) { x &= x - 1; c++; }
    return c;
  }

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /** Generate a fully solved random 9x9 grid (array of 81 ints). */
  function generateSolved() {
    const g = new Array(81).fill(0);
    const rows = new Array(9).fill(0);
    const cols = new Array(9).fill(0);
    const boxes = new Array(9).fill(0);

    function rec(pos) {
      if (pos === 81) return true;
      const r = (pos / 9) | 0, c = pos % 9, b = boxOf(pos);
      let avail = ~(rows[r] | cols[c] | boxes[b]) & ALL;
      const bits = [];
      while (avail) {
        const bit = avail & -avail;
        avail ^= bit;
        bits.push(bit);
      }
      shuffle(bits);

      for (let k = 0; k < bits.length; k++) {
        const bit = bits[k];
        g[pos] = 32 - Math.clz32(bit);
        rows[r] |= bit; cols[c] |= bit; boxes[b] |= bit;
        if (rec(pos + 1)) return true;
        rows[r] ^= bit; cols[c] ^= bit; boxes[b] ^= bit;
        g[pos] = 0;
      }
      return false;
    }

    rec(0);
    return g;
  }

  /** Count solutions of a grid, stopping early once `limit` is reached. */
  function countSolutions(grid, limit) {
    const g = grid.slice();
    const rows = new Array(9).fill(0);
    const cols = new Array(9).fill(0);
    const boxes = new Array(9).fill(0);
    const empties = [];

    for (let i = 0; i < 81; i++) {
      const v = g[i];
      const r = (i / 9) | 0, c = i % 9, b = boxOf(i);
      if (v) {
        const bit = 1 << (v - 1);
        rows[r] |= bit; cols[c] |= bit; boxes[b] |= bit;
      } else {
        empties.push(i);
      }
    }

    let count = 0;

    function rec(remaining) {
      if (remaining === 0) { count++; return; }

      // Minimum-remaining-values heuristic
      let best = -1, bestMask = 0, bestCnt = 10;
      for (let e = 0; e < empties.length; e++) {
        const i = empties[e];
        if (g[i]) continue;
        const r = (i / 9) | 0, c = i % 9, b = boxOf(i);
        const avail = ~(rows[r] | cols[c] | boxes[b]) & ALL;
        const cnt = popcount(avail);
        if (cnt === 0) return;
        if (cnt < bestCnt) {
          bestCnt = cnt; best = i; bestMask = avail;
          if (cnt === 1) break;
        }
      }
      if (best === -1) { count++; return; }

      const r = (best / 9) | 0, c = best % 9, b = boxOf(best);
      let m = bestMask;
      while (m) {
        const bit = m & -m;
        m ^= bit;
        g[best] = 32 - Math.clz32(bit);
        rows[r] |= bit; cols[c] |= bit; boxes[b] |= bit;

        rec(remaining - 1);

        rows[r] ^= bit; cols[c] ^= bit; boxes[b] ^= bit;
        g[best] = 0;

        if (count >= limit) return;
      }
    }

    rec(empties.length);
    return count;
  }

  const TARGET_GIVENS = { easy: 45, normal: 34, hard: 26 };

  /** Build a puzzle with a unique solution for the given difficulty. */
  function makePuzzle(difficulty) {
    const solution = generateSolved();
    const puzzle = solution.slice();
    const target = TARGET_GIVENS[difficulty] || 34;
    const order = shuffle(Array.from({ length: 81 }, (_, i) => i));

    let givens = 81;
    for (let k = 0; k < order.length && givens > target; k++) {
      const i = order[k];
      const backup = puzzle[i];
      puzzle[i] = 0;
      if (countSolutions(puzzle, 2) !== 1) {
        puzzle[i] = backup; // removal would break uniqueness
      } else {
        givens--;
      }
    }

    return { puzzle, solution };
  }

  /* =========================================================
     STATE
     ========================================================= */

  const state = {
    puzzle: new Array(81).fill(0),
    solution: new Array(81).fill(0),
    values: new Array(81).fill(0),
    notes: new Array(81).fill(0), // bitmask of pencil marks
    selected: null,
    pen: true,
    difficulty: "easy",
    mistakes: 0,
    finished: false,
    seconds: 0
  };

  let timerId = null;

  /* =========================================================
     DOM
     ========================================================= */

  const boardEl = document.getElementById("board");
  const numpadEl = document.getElementById("numpad");
  const loaderEl = document.getElementById("loader");
  const winEl = document.getElementById("win");
  const winTimeEl = document.getElementById("winTime");
  const timeEl = document.getElementById("time");
  const mistakesEl = document.getElementById("mistakes");
  const diffLabelEl = document.getElementById("diffLabel");
  const penBtn = document.getElementById("penBtn");
  const pencilBtn = document.getElementById("pencilBtn");
  const diffWrap = document.getElementById("difficulty");

  const cells = [];
  const numBtns = [];

  /* =========================================================
     BUILD UI
     ========================================================= */

  function buildBoard() {
    boardEl.innerHTML = "";
    cells.length = 0;

    for (let i = 0; i < 81; i++) {
      const r = (i / 9) | 0;
      const c = i % 9;

      const cell = document.createElement("div");
      cell.className = "cell";
      cell.dataset.i = String(i);
      if (c % 3 === 2 && c !== 8) cell.classList.add("br");
      if (r % 3 === 2 && r !== 8) cell.classList.add("bb");

      const val = document.createElement("div");
      val.className = "val";

      const notes = document.createElement("div");
      notes.className = "notes";
      for (let k = 0; k < 9; k++) notes.appendChild(document.createElement("i"));

      cell.appendChild(val);
      cell.appendChild(notes);
      cell.addEventListener("pointerdown", onCellPointerDown);

      boardEl.appendChild(cell);
      cells.push(cell);
    }
  }

  function buildNumpad() {
    numpadEl.innerHTML = "";
    numBtns.length = 0;

    for (let n = 1; n <= 9; n++) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.dataset.n = String(n);

      const label = document.createElement("span");
      label.textContent = String(n);
      const cnt = document.createElement("span");
      cnt.className = "cnt";

      btn.appendChild(label);
      btn.appendChild(cnt);
      btn.addEventListener("click", function () { inputNumber(n); });

      numpadEl.appendChild(btn);
      numBtns.push(btn);
    }
  }

  /* =========================================================
     INTERACTION
     ========================================================= */

  function onCellPointerDown(e) {
    e.preventDefault();
    selectCell(Number(this.dataset.i));
  }

  function selectCell(i) {
    if (state.finished) return;
    state.selected = i;
    render();
  }

  function inputNumber(n) {
    const i = state.selected;
    if (i === null || state.finished) return;
    if (state.puzzle[i] !== 0) return; // given clue — locked

    if (state.pen) {
      if (state.values[i] === n) {
        state.values[i] = 0; // tap same digit again to clear
      } else {
        state.values[i] = n;
        state.notes[i] = 0;
        if (n !== state.solution[i]) {
          state.mistakes++;
          mistakesEl.textContent = String(state.mistakes);
        }
        removePeerNotes(i, n);
      }
    } else {
      if (state.values[i] !== 0) return; // pencil only on empty cells
      state.notes[i] ^= (1 << (n - 1));
    }

    render();
    checkWin();
  }

  function eraseCell() {
    const i = state.selected;
    if (i === null || state.finished) return;
    if (state.puzzle[i] !== 0) return;
    state.values[i] = 0;
    state.notes[i] = 0;
    render();
  }

  function hint() {
    if (state.finished) return;

    let i = state.selected;
    if (i === null || state.puzzle[i] !== 0 || state.values[i] === state.solution[i]) {
      const candidates = [];
      for (let k = 0; k < 81; k++) {
        if (state.values[k] !== state.solution[k]) candidates.push(k);
      }
      if (!candidates.length) return;
      i = candidates[(Math.random() * candidates.length) | 0];
    }

    state.values[i] = state.solution[i];
    state.notes[i] = 0;
    state.selected = i;
    removePeerNotes(i, state.values[i]);

    render();
    checkWin();
  }

  function removePeerNotes(i, n) {
    const r = (i / 9) | 0, c = i % 9, b = boxOf(i);
    const bit = 1 << (n - 1);
    for (let j = 0; j < 81; j++) {
      if (j === i) continue;
      const rj = (j / 9) | 0, cj = j % 9;
      if (rj === r || cj === c || boxOf(j) === b) {
        state.notes[j] &= ~bit;
      }
    }
  }

  function setPen(isPen) {
    state.pen = isPen;
    penBtn.classList.toggle("on", isPen);
    pencilBtn.classList.toggle("on", !isPen);
  }

  function moveSelection(dr, dc) {
    let r, c;
    if (state.selected === null) {
      r = 0; c = 0;
    } else {
      r = (state.selected / 9) | 0;
      c = state.selected % 9;
    }
    r = Math.min(8, Math.max(0, r + dr));
    c = Math.min(8, Math.max(0, c + dc));
    state.selected = r * 9 + c;
    render();
  }

  /* =========================================================
     RENDER
     ========================================================= */

  function computeErrors() {
    const err = new Set();
    for (let i = 0; i < 81; i++) {
      const v = state.values[i];
      if (!v) continue;

      // conflict with a peer
      const r = (i / 9) | 0, c = i % 9, b = boxOf(i);
      for (let j = i + 1; j < 81; j++) {
        if (state.values[j] !== v) continue;
        if (((j / 9) | 0) === r || (j % 9) === c || boxOf(j) === b) {
          err.add(i);
          err.add(j);
        }
      }

      // wrong vs. the true solution
      if (v !== state.solution[i]) err.add(i);
    }
    return err;
  }

  function render() {
    const sel = state.selected;
    const selVal = sel !== null ? state.values[sel] : 0;
    const selR = sel !== null ? (sel / 9) | 0 : -1;
    const selC = sel !== null ? sel % 9 : -1;
    const selB = sel !== null ? boxOf(sel) : -1;

    const errors = computeErrors();

    for (let i = 0; i < 81; i++) {
      const cell = cells[i];
      const v = state.values[i];
      const r = (i / 9) | 0, c = i % 9, b = boxOf(i);

      const isSel = i === sel;
      const isPeer = sel !== null && !isSel && (r === selR || c === selC || b === selB);
      const isSame = selVal !== 0 && v === selVal && !isSel;

      cell.classList.toggle("selected", isSel);
      cell.classList.toggle("peer", isPeer);
      cell.classList.toggle("same", isSame);
      cell.classList.toggle("given", state.puzzle[i] !== 0);
      cell.classList.toggle("error", errors.has(i));

      const valEl = cell.children[0];
      const notesEl = cell.children[1];

      if (v !== 0) {
        const txt = String(v);
        if (valEl.textContent !== txt) valEl.textContent = txt;
        notesEl.classList.remove("show");
      } else {
        if (valEl.textContent !== "") valEl.textContent = "";
        const mask = state.notes[i];
        if (mask) {
          notesEl.classList.add("show");
          for (let k = 0; k < 9; k++) {
            const noteEl = notesEl.children[k];
            const on = (mask >> k) & 1;
            const txt = on ? String(k + 1) : "";
            if (noteEl.textContent !== txt) noteEl.textContent = txt;
            noteEl.classList.toggle("hl", !!on && selVal === k + 1);
          }
        } else {
          notesEl.classList.remove("show");
        }
      }
    }

    renderNumpad();
  }

  function renderNumpad() {
    const counts = new Array(10).fill(0);
    for (let i = 0; i < 81; i++) {
      const v = state.values[i];
      if (v) counts[v]++;
    }
    for (let n = 1; n <= 9; n++) {
      const left = 9 - counts[n];
      const btn = numBtns[n - 1];
      btn.classList.toggle("done", left <= 0);
      btn.querySelector(".cnt").textContent = left > 0 ? String(left) : "";
    }
  }

  /* =========================================================
     TIMER / WIN
     ========================================================= */

  function formatTime(total) {
    const m = Math.floor(total / 60);
    const s = total % 60;
    return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  }

  function startTimer() {
    stopTimer();
    state.seconds = 0;
    timeEl.textContent = "00:00";
    timerId = setInterval(function () {
      state.seconds++;
      timeEl.textContent = formatTime(state.seconds);
    }, 1000);
  }

  function stopTimer() {
    if (timerId !== null) {
      clearInterval(timerId);
      timerId = null;
    }
  }

  function checkWin() {
    for (let i = 0; i < 81; i++) {
      if (state.values[i] !== state.solution[i]) return;
    }
    state.finished = true;
    stopTimer();
    winTimeEl.textContent = "Time " + formatTime(state.seconds) + " · " + labelFor(state.difficulty);
    winEl.classList.add("show");
  }

  function labelFor(d) {
    return d.charAt(0).toUpperCase() + d.slice(1);
  }

  /* =========================================================
     NEW GAME
     ========================================================= */

  function setLoading(on) {
    loaderEl.classList.toggle("show", on);
  }

  function newGame() {
    setLoading(true);
    winEl.classList.remove("show");

    // Let the browser paint the loader before the (synchronous) generation.
    setTimeout(function () {
      const built = makePuzzle(state.difficulty);

      state.puzzle = built.puzzle;
      state.solution = built.solution;
      state.values = built.puzzle.slice();
      state.notes = new Array(81).fill(0);
      state.selected = null;
      state.mistakes = 0;
      state.finished = false;

      mistakesEl.textContent = "0";
      diffLabelEl.textContent = labelFor(state.difficulty);

      setLoading(false);
      startTimer();
      render();
    }, 30);
  }

  /* =========================================================
     EVENTS
     ========================================================= */

  diffWrap.addEventListener("click", function (e) {
    const btn = e.target.closest("button[data-diff]");
    if (!btn) return;
    const d = btn.dataset.diff;
    if (d === state.difficulty) return;

    state.difficulty = d;
    Array.prototype.forEach.call(diffWrap.children, function (b) {
      b.classList.toggle("on", b === btn);
    });
    newGame();
  });

  document.getElementById("newGame").addEventListener("click", newGame);
  document.getElementById("winNew").addEventListener("click", newGame);
  document.getElementById("eraseBtn").addEventListener("click", eraseCell);
  document.getElementById("hintBtn").addEventListener("click", hint);

  penBtn.addEventListener("click", function () { setPen(true); });
  pencilBtn.addEventListener("click", function () { setPen(false); });

  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;

    if (e.key >= "1" && e.key <= "9") {
      inputNumber(Number(e.key));
      e.preventDefault();
    } else if (e.key === "Backspace" || e.key === "Delete" || e.key === "0") {
      eraseCell();
      e.preventDefault();
    } else if (e.key.indexOf("Arrow") === 0) {
      if (e.key === "ArrowUp") moveSelection(-1, 0);
      else if (e.key === "ArrowDown") moveSelection(1, 0);
      else if (e.key === "ArrowLeft") moveSelection(0, -1);
      else moveSelection(0, 1);
      e.preventDefault();
    } else if (e.key === "n" || e.key === "N") {
      setPen(!state.pen);
    } else if (e.key === "p" || e.key === "P") {
      setPen(!state.pen);
    }
  });

  /* =========================================================
     INIT
     ========================================================= */

  buildBoard();
  buildNumpad();
  setPen(true);
  newGame();
})();
</script>
</body>
</html>
