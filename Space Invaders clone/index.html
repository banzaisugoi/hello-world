<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Space Defender - Ultimate</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; background-color: #0a0a0a; color: white;
            font-family: 'Press Start 2P', monospace; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; user-select: none;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 60px rgba(0,255,0,0.25), 0 0 120px rgba(0,255,0,0.08);
            border: 4px solid #222; border-radius: 4px; overflow: hidden;
        }
        #game-container::after {
            content: ''; position: absolute; inset: 0;
            background: repeating-linear-gradient(0deg,
                rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px,
                transparent 1px, transparent 3px);
            pointer-events: none; z-index: 100;
        }
        canvas { display: block; background: #000; cursor: crosshair; }
        .ui-layer {
            position: absolute; inset: 0; pointer-events: none;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 50;
        }
        .hud {
            position: absolute; top: 14px; left: 20px;
            font-size: 14px; color: #fff;
            text-shadow: 2px 2px 0 #000, 0 0 10px rgba(0,255,0,0.5);
            z-index: 60; pointer-events: none;
        }
        .high-score-container {
            position: absolute; top: 14px; right: 20px;
            font-size: 14px; color: #ffeb3b; text-align: right;
            text-shadow: 2px 2px 0 #000; z-index: 60; pointer-events: none;
        }
        .lives-container {
            position: absolute; top: 44px; left: 20px;
            display: flex; align-items: center; gap: 10px;
            z-index: 60; pointer-events: none;
        }
        .lives-label { font-size: 10px; color: #666; letter-spacing: 1px; }
        .lives-icons { display: flex; gap: 8px; }
        .life-icon {
            width: 0; height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 14px solid #4caf50;
            filter: drop-shadow(0 0 4px rgba(76,175,80,0.6));
            transition: all 0.3s;
        }
        .life-icon.lost { border-bottom-color: #333; filter: none; opacity: 0.3; }
        
        .weapon-hud {
            position: absolute; top: 44px; right: 20px;
            display: flex; flex-direction: column; align-items: flex-end;
            gap: 5px; z-index: 60; pointer-events: none;
        }
        .weapon-badge {
            font-size: 10px; padding: 4px 8px; border-radius: 3px;
            background: rgba(0,0,0,0.7); border: 1px solid; display: none;
        }
        .weapon-badge.active { display: block; animation: pulse 0.5s infinite alternate; }
        .weapon-badge.rapid { color: #00e5ff; border-color: #00e5ff; }
        .weapon-badge.spread { color: #ff4081; border-color: #ff4081; }

        .screen {
            background: rgba(0,0,0,0.9); padding: 40px 50px;
            border: 2px solid #4caf50; text-align: center;
            pointer-events: auto; border-radius: 8px;
            box-shadow: 0 0 40px rgba(76,175,80,0.3); max-width: 80%;
        }
        .hidden { display: none !important; }
        h1 {
            font-size: 36px; margin: 0 0 20px 0; color: #4caf50;
            text-shadow: 4px 4px 0 #000, 0 0 20px rgba(76,175,80,0.6);
            line-height: 1.3; letter-spacing: 2px;
        }
        h1.game-over { color: #ff5252; text-shadow: 4px 4px 0 #000, 0 0 20px rgba(255,82,82,0.6); }
        p { line-height: 2; font-size: 12px; color: #aaa; margin: 10px 0; letter-spacing: 1px; }
        .controls { margin: 20px 0; font-size: 10px; color: #666; letter-spacing: 1px; }
        .controls span { color: #4caf50; }
        button {
            background: #4caf50; color: #000; border: none;
            padding: 16px 32px; font-family: inherit; font-size: 16px;
            cursor: pointer; margin-top: 20px;
            box-shadow: 4px 4px 0px #1b5e20;
            transition: transform 0.08s, box-shadow 0.08s;
            letter-spacing: 1px;
        }
        button:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0px #1b5e20; }
        button:active { transform: translate(2px,2px); box-shadow: 1px 1px 0px #1b5e20; }
        .new-high { color: #ffeb3b !important; font-size: 12px; margin-top: 15px; animation: pulse 0.6s infinite alternate; }
        @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }
    </style>
</head>
<body>
<div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div class="hud">SCORE: <span id="scoreEl">0</span></div>
    <div class="high-score-container">HI-SCORE: <span id="highScoreEl">0</span></div>
    <div class="lives-container">
        <span class="lives-label">LIVES</span>
        <div class="lives-icons" id="livesEl"></div>
    </div>
    <div class="weapon-hud">
        <div id="rapidBadge" class="weapon-badge rapid">RAPID FIRE</div>
        <div id="spreadBadge" class="weapon-badge spread">SPREAD SHOT</div>
    </div>

    <div id="startScreen" class="ui-layer screen">
        <h1>SPACE<br>DEFENDER</h1>
        <div class="controls">
            MOUSE <span>&#9654;</span> MOVE &nbsp;|&nbsp; CLICK / SPACE <span>&#9654;</span> FIRE
        </div>
        <p>SURVIVE EVERY 5TH WAVE TO FACE THE BOSS</p>
        <button id="startBtn">START GAME</button>
    </div>

    <div id="gameOverScreen" class="ui-layer screen hidden">
        <h1 class="game-over">GAME OVER</h1>
        <p>FINAL SCORE: <span id="finalScore" style="color:#fff;">0</span></p>
        <p>REACHED WAVE: <span id="finalWave" style="color:#fff;">1</span></p>
        <p id="newHighScore" class="new-high hidden">&#9733; NEW HIGH SCORE! &#9733;</p>
        <button id="restartBtn">TRY AGAIN</button>
    </div>
</div>

<script>
/* ============ AUDIO ============ */
const AudioSys = (() => {
    let ctx = null;
    let ufoOsc = null, ufoGain = null;

    function init() {
        if (!ctx) {
            const C = window.AudioContext || window.webkitAudioContext;
            ctx = new C();
        }
        if (ctx.state === 'suspended') ctx.resume();
    }
    function tone(freq, type, dur, vol = 0.1, freqEnd = null) {
        if (!ctx) return;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, ctx.currentTime);
        if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + dur);
        g.gain.setValueAtTime(vol, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        o.connect(g); g.connect(ctx.destination);
        o.start(); o.stop(ctx.currentTime + dur);
    }
    function noise(dur, vol = 0.15) {
        if (!ctx) return;
        const n = Math.floor(ctx.sampleRate * dur);
        const buf = ctx.createBuffer(1, n, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
        const s = ctx.createBufferSource(); s.buffer = buf;
        const g = ctx.createGain();
        g.gain.setValueAtTime(vol, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        s.connect(g); g.connect(ctx.destination); s.start();
    }

    return {
        init,
        shoot:      () => tone(880, 'square', 0.08, 0.06, 220),
        enemyHit:   () => noise(0.12, 0.1),
        enemyShoot: () => tone(440, 'sawtooth', 0.15, 0.03, 120),
        dive:       () => tone(650, 'triangle', 0.4, 0.04, 180),
        bunkerHit:  () => noise(0.08, 0.05),
        powerup:    () => { tone(660, 'square', 0.1, 0.1); setTimeout(() => tone(880, 'square', 0.15, 0.1), 100); },
        bossHit:    () => tone(300, 'sawtooth', 0.05, 0.05),
        bossDie:    () => { noise(1.0, 0.3); tone(200, 'sawtooth', 1.0, 0.15, 40); },
        waveClear:  () => {
            tone(523, 'square', 0.1, 0.08);
            setTimeout(() => tone(659, 'square', 0.1, 0.08), 100);
            setTimeout(() => tone(784, 'square', 0.15, 0.08), 200);
        },
        playerHit:  () => { tone(200, 'sawtooth', 0.3, 0.15, 50); noise(0.4, 0.18); },
        gameOver:   () => { tone(300, 'square', 0.5, 0.1, 60); setTimeout(() => noise(0.8, 0.15), 200); },
        startUFO: () => {
            if (!ctx || ufoOsc) return;
            ufoOsc = ctx.createOscillator(); ufoGain = ctx.createGain();
            ufoOsc.type = 'sine'; ufoOsc.frequency.value = 600;
            ufoGain.gain.value = 0.05;
            ufoOsc.connect(ufoGain); ufoGain.connect(ctx.destination);
            ufoOsc.start();
            const t = ctx.currentTime;
            ufoOsc.frequency.setValueAtTime(600, t);
            ufoOsc.frequency.linearRampToValueAtTime(1000, t + 0.2);
            ufoOsc.frequency.linearRampToValueAtTime(600, t + 0.4);
            ufoOsc.frequency.linearRampToValueAtTime(1000, t + 0.6);
            ufoOsc.frequency.linearRampToValueAtTime(600, t + 0.8);
        },
        stopUFO: () => {
            if (ufoOsc) { ufoOsc.stop(); ufoOsc.disconnect(); ufoOsc = null; }
        }
    };
})();

/* ============ SETUP & STATE ============ */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreEl');
const highScoreEl = document.getElementById('highScoreEl');
const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');

let gameActive = false;
let score = 0;
let highScore = parseInt(localStorage.getItem('spaceInvadersHigh'), 10) || 0;
let wave = 1;
let gameOverFlash = 0;
highScoreEl.innerText = highScore;

const PLAYER_WIDTH = 44, PLAYER_HEIGHT = 32;
const PLAYER_Y = canvas.height - 55;
const BASE_BULLET_SPEED = 11;
const ENEMY_WIDTH = 40, ENEMY_HEIGHT = 32;
const ROW_COUNT = 4, COL_COUNT = 9;
const ENEMY_DROP = 20;
const ENEMY_COLORS = ['#ff5252', '#ff9800', '#ffeb3b', '#4caf50'];
const MAX_LIVES = 3;
const INVULN_FRAMES = 120;
const ENEMY_BULLET_SPEED = 4.5;
const DIVE_SPEED = 3.2;

let lives = MAX_LIVES;
let invulnerability = 0;

const player = { 
    x: canvas.width / 2 - PLAYER_WIDTH / 2, y: PLAYER_Y,
    weapon: 'normal', weaponTimer: 0
};
let bullets = [];
let enemyBullets = [];
let enemies = [];
let particles = [];
let bunkers = [];
let powerups = [];
let ufo = null;
let ufoTimer = 600;
let boss = null;
const stars = [];

let enemyDir = 1;
let waveBaseSpeed = 1.0;
let formX = 100, formY = 60;
let enemyShootTimer = 150;
let diveTimer = 300;

let mouseX = canvas.width / 2;
let shootCooldown = 0;
let waveTextTimer = 0;
let waveTextToShow = '';

for (let i = 0; i < 120; i++) {
    stars.push({
        x: Math.random() * canvas.width, y: Math.random() * canvas.height,
        size: Math.random() * 1.8 + 0.4, speed: Math.random() * 0.5 + 0.1,
        twinkle: Math.random() * Math.PI * 2
    });
}

/* ============ UI HELPERS ============ */
function updateLivesUI() {
    const el = document.getElementById('livesEl');
    el.innerHTML = '';
    for (let i = 0; i < MAX_LIVES; i++) {
        const icon = document.createElement('div');
        icon.className = 'life-icon' + (i >= lives ? ' lost' : '');
        el.appendChild(icon);
    }
}
function updateWeaponUI() {
    const r = document.getElementById('rapidBadge');
    const s = document.getElementById('spreadBadge');
    r.classList.toggle('active', player.weapon === 'rapid');
    s.classList.toggle('active', player.weapon === 'spread');
}
updateLivesUI();

/* ============ BUNKERS (SHIELDS) ============ */
function createBunkers() {
    bunkers = [];
    const bW = 12, bH = 8, cellSize = 4;
    const startX = 120, spacing = 170;
    
    for (let i = 0; i < 4; i++) {
        const blocks = [];
        for (let r = 0; r < bH; r++) {
            for (let c = 0; c < bW; c++) {
                if (r > bH - 4 && c > 2 && c < bW - 3) continue;
                blocks.push({ x: c * cellSize, y: r * cellSize, active: true });
            }
        }
        bunkers.push({
            x: startX + i * spacing, y: PLAYER_Y - 100,
            cellSize, blocks
        });
    }
}

function checkBunkerCollision(bx, by, radius = 4) {
    for (const b of bunkers) {
        for (const block of b.blocks) {
            if (!block.active) continue;
            const bxPos = b.x + block.x;
            const byPos = b.y + block.y;
            const size = b.cellSize;
            
            if (bx + radius > bxPos && bx - radius < bxPos + size &&
                by + radius > byPos && by - radius < byPos + size) {
                for (const b2 of b.blocks) {
                    if (!b2.active) continue;
                    const dx = b2.x - block.x;
                    const dy = b2.y - block.y;
                    if (dx*dx + dy*dy <= 12) b2.active = false;
                }
                return true;
            }
        }
    }
    return false;
}

function drawBunkers() {
    ctx.fillStyle = '#4caf50';
    for (const b of bunkers) {
        for (const block of b.blocks) {
            if (block.active) {
                ctx.fillRect(b.x + block.x, b.y + block.y, b.cellSize, b.cellSize);
            }
        }
    }
}

/* ============ POWERUPS ============ */
function maybeDropPowerup(x, y) {
    if (Math.random() < 0.06) {
        const type = Math.random() < 0.5 ? 'rapid' : 'spread';
        powerups.push({ x: x - 8, y, type, speed: 2 });
    }
}

function drawPowerups() {
    for (const p of powerups) {
        ctx.fillStyle = p.type === 'rapid' ? '#00e5ff' : '#ff4081';
        ctx.fillRect(p.x, p.y, 16, 16);
        ctx.fillStyle = '#000';
        ctx.font = '10px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText(p.type === 'rapid' ? 'R' : 'S', p.x + 8, p.y + 12);
    }
}

/* ============ UFO ============ */
function spawnUFO() {
    const dir = Math.random() < 0.5 ? 1 : -1;
    ufo = {
        x: dir === 1 ? -50 : canvas.width + 50,
        y: 60, dir, speed: 3,
        points: [50, 100, 150, 300][Math.floor(Math.random() * 4)]
    };
    AudioSys.startUFO();
}

function updateUFO() {
    if (!ufo) {
        ufoTimer--;
        if (ufoTimer <= 0) spawnUFO();
        return;
    }

    ufo.x += ufo.speed * ufo.dir;

    if (ufo.x < -80 || ufo.x > canvas.width + 80) {
        ufo = null;
        ufoTimer = 600 + Math.random() * 600;
        AudioSys.stopUFO();
    }
}

function drawUFO() {
    if (!ufo) return;
    const x = ufo.x, y = ufo.y;
    ctx.fillStyle = '#ff1744';
    ctx.beginPath();
    ctx.arc(x + 20, y + 8, 10, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(x, y + 8, 40, 8);
    ctx.fillStyle = '#ffeb3b';
    ctx.fillRect(x + 5, y + 10, 4, 4);
    ctx.fillRect(x + 18, y + 10, 4, 4);
    ctx.fillRect(x + 31, y + 10, 4, 4);
}

/* ============ BOSS ============ */
function spawnBoss() {
    boss = {
        x: canvas.width / 2 - 80, y: 80,
        width: 160, height: 80,
        hp: 100 + (wave / 5) * 50,
        maxHp: 100 + (wave / 5) * 50,
        dir: 1, speed: 2,
        shootTimer: 60,
        bobPhase: 0
    };
}

function updateBoss() {
    if (!boss) return;
    
    boss.x += boss.speed * boss.dir;
    boss.bobPhase += 0.05;
    boss.y = 80 + Math.sin(boss.bobPhase) * 20;

    if (boss.x <= 20) { boss.x = 20; boss.dir = 1; }
    if (boss.x + boss.width >= canvas.width - 20) { boss.x = canvas.width - boss.width - 20; boss.dir = -1; }

    boss.shootTimer--;
    if (boss.shootTimer <= 0) {
        for (let i = -1; i <= 1; i++) {
            enemyBullets.push({
                x: boss.x + boss.width / 2 + i * 30,
                y: boss.y + boss.height,
                vx: i * 1.5,
                vy: ENEMY_BULLET_SPEED
            });
        }
        boss.shootTimer = 70;
    }
}

function drawBoss() {
    if (!boss) return;
    const x = boss.x, y = boss.y, w = boss.width, h = boss.height;
    
    ctx.fillStyle = '#880e4f';
    ctx.beginPath();
    ctx.moveTo(x + w/2, y);
    ctx.lineTo(x + w, y + h*0.6);
    ctx.lineTo(x + w*0.8, y + h);
    ctx.lineTo(x + w*0.2, y + h);
    ctx.lineTo(x, y + h*0.6);
    ctx.fill();

    ctx.fillStyle = '#ff5252';
    ctx.fillRect(x + 20, y + 20, w - 40, h - 40);
    
    ctx.fillStyle = '#ffeb3b';
    ctx.fillRect(x + w*0.25, y + h*0.4, 20, 15);
    ctx.fillRect(x + w*0.65, y + h*0.4, 20, 15);
    
    const barW = 200, barH = 10;
    const barX = canvas.width / 2 - barW / 2;
    const barY = 30;
    ctx.fillStyle = '#333';
    ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = '#ff1744';
    ctx.fillRect(barX, barY, barW * (boss.hp / boss.maxHp), barH);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(barX, barY, barW, barH);
}

/* ============ ENEMY GRID ============ */
function getFormX(col) { return formX + col * (ENEMY_WIDTH + 22); }
function getFormY(row) { return formY + row * (ENEMY_HEIGHT + 18); }

function initEnemies() {
    enemies = [];
    formX = 100; formY = 60; enemyDir = 1;
    if (wave % 5 === 0) {
        spawnBoss();
        return;
    }
    boss = null;
    for (let r = 0; r < ROW_COUNT; r++) {
        for (let c = 0; c < COL_COUNT; c++) {
            enemies.push({
                row: r, col: c, active: true, state: 'formation',
                x: 0, y: 0, diveTime: 0, diveStartX: 0,
                divePhase: (Math.random() - 0.5) * 1.2, trail: [],
                returnTimer: 0 
            });
        }
    }
    syncFormationEnemies();
    enemyShootTimer = 150;
    diveTimer = 300;
}

function syncFormationEnemies() {
    for (const e of enemies) {
        if (e.active && e.state === 'formation') {
            e.x = getFormX(e.col);
            e.y = getFormY(e.row);
        }
    }
}

/* ============ DRAWING ============ */
function drawStars() {
    for (const s of stars) {
        s.twinkle += 0.04; s.y += s.speed;
        if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
        ctx.fillStyle = `rgba(255,255,255,${0.25 + Math.sin(s.twinkle) * 0.25})`;
        ctx.fillRect(s.x, s.y, s.size, s.size);
    }
}

function drawPlayer() {
    if (invulnerability > 0) {
        ctx.globalAlpha = 0.35 + Math.abs(Math.sin(invulnerability * 0.25)) * 0.65;
    }
    const x = player.x, y = player.y;
    const flicker = Math.random() * 4;
    ctx.fillStyle = `rgba(100,255,150,${0.5 + Math.random() * 0.3})`;
    ctx.fillRect(x + 9, y + PLAYER_HEIGHT, 6, 4 + flicker);
    ctx.fillRect(x + PLAYER_WIDTH - 15, y + PLAYER_HEIGHT, 6, 4 + flicker);
    
    ctx.fillStyle = '#4caf50';
    ctx.beginPath();
    ctx.moveTo(x + PLAYER_WIDTH / 2, y);
    ctx.lineTo(x + PLAYER_WIDTH, y + PLAYER_HEIGHT - 6);
    ctx.lineTo(x + PLAYER_WIDTH - 10, y + PLAYER_HEIGHT);
    ctx.lineTo(x + 10, y + PLAYER_HEIGHT);
    ctx.lineTo(x, y + PLAYER_HEIGHT - 6);
    ctx.closePath(); ctx.fill();
    
    ctx.fillStyle = '#a5d6a7';
    ctx.beginPath();
    ctx.arc(x + PLAYER_WIDTH / 2, y + PLAYER_HEIGHT * 0.55, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
}

function drawEnemy(e) {
    const x = e.x, y = e.y;
    const color = ENEMY_COLORS[e.row % ENEMY_COLORS.length];
    if (e.state === 'diving' && e.trail.length > 1) {
        for (let i = 0; i < e.trail.length; i++) {
            ctx.fillStyle = color;
            ctx.globalAlpha = i / e.trail.length * 0.4;
            ctx.fillRect(e.trail[i].x + ENEMY_WIDTH/2 - 3, e.trail[i].y + ENEMY_HEIGHT/2 - 3, 6, 6);
        }
        ctx.globalAlpha = 1;
    }
    ctx.fillStyle = color;
    ctx.fillRect(x + 5, y + 9, ENEMY_WIDTH - 10, ENEMY_HEIGHT - 13);
    ctx.fillRect(x + 8, y + 2, 3, 9);
    ctx.fillRect(x + ENEMY_WIDTH - 11, y + 2, 3, 9);
    ctx.fillRect(x + 8, y + ENEMY_HEIGHT - 5, 5, 5);
    ctx.fillRect(x + ENEMY_WIDTH - 13, y + ENEMY_HEIGHT - 5, 5, 5);
    ctx.fillStyle = '#000';
    ctx.fillRect(x + 12, y + 14, 5, 5);
    ctx.fillRect(x + ENEMY_WIDTH - 17, y + 14, 5, 5);
}

function drawBullet(b) {
    ctx.fillStyle = '#ffeb3b';
    ctx.fillRect(b.x - 2, b.y - 10, 4, 18);
    ctx.fillStyle = 'rgba(255,235,59,0.35)';
    ctx.fillRect(b.x - 2, b.y + 8, 4, 12);
}

function drawEnemyBullet(b) {
    ctx.fillStyle = '#ff5252';
    ctx.fillRect(b.x - 2, b.y - 8, 4, 16);
    ctx.fillStyle = 'rgba(255,82,82,0.4)';
    ctx.fillRect(b.x - 4, b.y + 6, 8, 8);
}

function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;
}

function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawStars();
    
    if (gameActive || gameOverFlash > 0) {
        drawBunkers();
        for (const e of enemies) if (e.active) drawEnemy(e);
        drawUFO();
        drawBoss();
        drawPowerups();
        for (const b of bullets) drawBullet(b);
        for (const b of enemyBullets) drawEnemyBullet(b);
        if (gameActive) drawPlayer();
    }

    drawParticles();

    if (waveTextTimer > 0) {
        ctx.save();
        ctx.font = '28px "Press Start 2P", monospace';
        ctx.textAlign = 'center';
        ctx.fillStyle = `rgba(255,255,255,${Math.min(1, waveTextTimer / 30)})`;
        ctx.fillText(waveTextToShow, canvas.width / 2, canvas.height / 2 - 80);
        ctx.restore();
        waveTextTimer--;
    }

    if (gameOverFlash > 0) {
        ctx.fillStyle = `rgba(255,0,0,${(gameOverFlash / 45) * 0.35})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        gameOverFlash--;
    }
}

/* ============ PARTICLES ============ */
function createParticles(x, y, color, count = 12) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 7,
            vy: (Math.random() - 0.5) * 7 - 1,
            size: Math.random() * 3 + 1.5,
            life: 1.0, decay: 0.025 + Math.random() * 0.02, color
        });
    }
}

/* ============ INPUT ============ */
function setMouseFromEvent(clientX) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    mouseX = (clientX - rect.left) * scaleX;
    const halfW = PLAYER_WIDTH / 2;
    if (mouseX < halfW) mouseX = halfW;
    if (mouseX > canvas.width - halfW) mouseX = canvas.width - halfW;
}

canvas.addEventListener('mousemove', (e) => setMouseFromEvent(e.clientX));
canvas.addEventListener('click', () => { if (gameActive) tryShoot(); });
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); setMouseFromEvent(e.touches[0].clientX); }, { passive: false });
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault(); setMouseFromEvent(e.touches[0].clientX);
    if (gameActive) tryShoot();
}, { passive: false });

document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && gameActive) { e.preventDefault(); tryShoot(); }
    if (e.code === 'Enter' && !gameActive) startGame();
});

function tryShoot() {
    if (!gameActive || shootCooldown > 0) return;
    
    const maxBullets = player.weapon === 'rapid' ? 6 : 3;
    if (bullets.length >= maxBullets) return;

    const cx = player.x + PLAYER_WIDTH / 2;
    const cy = player.y - 5;

    if (player.weapon === 'spread') {
        bullets.push({ x: cx, y: cy, vx: 0, vy: -BASE_BULLET_SPEED });
        bullets.push({ x: cx, y: cy, vx: -3, vy: -BASE_BULLET_SPEED });
        bullets.push({ x: cx, y: cy, vx: 3, vy: -BASE_BULLET_SPEED });
    } else {
        bullets.push({ x: cx, y: cy, vx: 0, vy: -BASE_BULLET_SPEED });
    }

    shootCooldown = player.weapon === 'rapid' ? 4 : 9;
    AudioSys.shoot();
}

/* ============ ENEMY ACTIONS ============ */
function enemyShoot() {
    const alive = enemies.filter(e => e.active && e.state === 'formation');
    if (alive.length === 0) return;
    const bottomRow = alive.filter(e => e.row === ROW_COUNT - 1);
    const pool = bottomRow.length > 0 ? bottomRow : alive;
    const shooter = pool[Math.floor(Math.random() * pool.length)];
    enemyBullets.push({ x: shooter.x + ENEMY_WIDTH / 2, y: shooter.y + ENEMY_HEIGHT, vx: 0, vy: ENEMY_BULLET_SPEED });
    AudioSys.enemyShoot();
}

function startDive() {
    if (enemies.some(e => e.active && e.state === 'diving')) return;
    const candidates = enemies.filter(e => e.active && e.state === 'formation');
    if (candidates.length === 0) return;
    const e = candidates[Math.floor(Math.random() * candidates.length)];
    e.state = 'diving';
    e.diveTime = 0;
    e.diveStartX = e.x;
    e.trail = [];
    AudioSys.dive();
}

/* ============ DAMAGE & DEATH ============ */
function damagePlayer() {
    if (invulnerability > 0 || !gameActive) return;
    lives--;
    updateLivesUI();
    invulnerability = INVULN_FRAMES;
    enemyBullets = [];
    player.weapon = 'normal';
    player.weaponTimer = 0;
    updateWeaponUI();
    createParticles(player.x + PLAYER_WIDTH / 2, player.y + PLAYER_HEIGHT / 2, '#4caf50');
    createParticles(player.x + PLAYER_WIDTH / 2, player.y + PLAYER_HEIGHT / 2, '#ffeb3b');
    AudioSys.playerHit();
    if (lives <= 0) triggerGameOver();
}

/* ============ UPDATE ============ */
function update() {
    if (!gameActive) return;

    player.x = mouseX - PLAYER_WIDTH / 2;
    if (shootCooldown > 0) shootCooldown--;
    if (invulnerability > 0) invulnerability--;
    
    if (player.weaponTimer > 0) {
        player.weaponTimer--;
        if (player.weaponTimer <= 0) {
            player.weapon = 'normal';
            updateWeaponUI();
        }
    }

    // --- Player bullets ---
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx || 0;
        b.y += b.vy;
        
        if (b.y < -20 || b.x < -20 || b.x > canvas.width + 20) { bullets.splice(i, 1); continue; }

        if (checkBunkerCollision(b.x, b.y)) {
            bullets.splice(i, 1); AudioSys.bunkerHit(); continue;
        }

        let hit = false;
        for (const e of enemies) {
            if (!e.active) continue;
            if (b.x > e.x && b.x < e.x + ENEMY_WIDTH && b.y > e.y && b.y < e.y + ENEMY_HEIGHT) {
                e.active = false;
                bullets.splice(i, 1);
                score += 10; scoreEl.innerText = score;
                createParticles(e.x + ENEMY_WIDTH / 2, e.y + ENEMY_HEIGHT / 2, ENEMY_COLORS[e.row % 4]);
                maybeDropPowerup(e.x + ENEMY_WIDTH / 2, e.y);
                AudioSys.enemyHit();
                hit = true;
                break;
            }
        }
        if (hit) continue;

        if (boss && b.x > boss.x && b.x < boss.x + boss.width && b.y > boss.y && b.y < boss.y + boss.height) {
            bullets.splice(i, 1);
            boss.hp -= 1;
            createParticles(b.x, b.y, '#ff5252', 3);
            AudioSys.bossHit();
            if (boss.hp <= 0) {
                createParticles(boss.x + boss.width/2, boss.y + boss.height/2, '#ffeb3b', 40);
                createParticles(boss.x + boss.width/2, boss.y + boss.height/2, '#ff5252', 40);
                score += 1000; scoreEl.innerText = score;
                boss = null;
                AudioSys.bossDie();
            }
            continue;
        }

        if (ufo && b.x > ufo.x && b.x < ufo.x + 40 && b.y > ufo.y && b.y < ufo.y + 20) {
            bullets.splice(i, 1);
            score += ufo.points; scoreEl.innerText = score;
            createParticles(ufo.x + 20, ufo.y + 10, '#ff1744', 20);
            ufo = null;
            ufoTimer = 600 + Math.random() * 600;
            AudioSys.stopUFO();
            AudioSys.enemyHit();
            continue;
        }
    }

    // --- Enemy bullets ---
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const b = enemyBullets[i];
        b.x += b.vx || 0;
        b.y += b.vy;
        
        if (b.y > canvas.height + 20 || b.x < -20 || b.x > canvas.width + 20) { enemyBullets.splice(i, 1); continue; }

        if (checkBunkerCollision(b.x, b.y)) {
            enemyBullets.splice(i, 1); AudioSys.bunkerHit(); continue;
        }

        if (b.x > player.x && b.x < player.x + PLAYER_WIDTH && b.y > player.y && b.y < player.y + PLAYER_HEIGHT) {
            enemyBullets.splice(i, 1);
            damagePlayer();
            continue;
        }
    }

    // --- Particles ---
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.12;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // --- Powerups ---
    for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.y += p.speed;
        if (p.y > canvas.height) { powerups.splice(i, 1); continue; }
        
        if (p.x < player.x + PLAYER_WIDTH && p.x + 16 > player.x &&
            p.y < player.y + PLAYER_HEIGHT && p.y + 16 > player.y) {
            player.weapon = p.type;
            player.weaponTimer = 600;
            updateWeaponUI();
            AudioSys.powerup();
            powerups.splice(i, 1);
        }
    }

    // --- UFO & Boss ---
    updateUFO();
    updateBoss();

    // --- Wave clear check ---
    const activeEnemies = enemies.filter(e => e.active);
    if (activeEnemies.length === 0 && !boss) {
        wave++;
        waveBaseSpeed += 0.15;
        score += 100; scoreEl.innerText = score;
        waveTextToShow = wave % 5 === 0 ? 'WARNING: BOSS' : 'WAVE ' + wave;
        waveTextTimer = 90;
        enemyBullets = [];
        createBunkers();
        initEnemies();
        AudioSys.waveClear();
        return;
    }

    // --- Formation movement ---
    if (!boss) {
        const aliveFormation = enemies.filter(e => e.active && e.state === 'formation');
        const speed = waveBaseSpeed + (ROW_COUNT * COL_COUNT - activeEnemies.length) * 0.045;

        if (aliveFormation.length > 0) {
            const minCol = Math.min(...aliveFormation.map(e => e.col));
            const maxCol = Math.max(...aliveFormation.map(e => e.col));

            // Dynamic boundaries: calculate exact screen edges based on the alive columns
            const minFormX = 10 - minCol * (ENEMY_WIDTH + 22);
            const maxFormX = canvas.width - 10 - ENEMY_WIDTH - maxCol * (ENEMY_WIDTH + 22);

            formX += speed * enemyDir;

            if (enemyDir > 0 && formX >= maxFormX) {
                formX = maxFormX;
                enemyDir = -1;
                formY += ENEMY_DROP;
            } else if (enemyDir < 0 && formX <= minFormX) {
                formX = minFormX;
                enemyDir = 1;
                formY += ENEMY_DROP;
            }
        }
        
        syncFormationEnemies();

        // --- Diving enemies ---
        for (const e of enemies) {
            if (!e.active) continue;
            if (e.state === 'diving') {
                e.diveTime++;
                e.x = e.diveStartX + Math.sin(e.diveTime * 0.05 + e.divePhase) * 120;
                e.x = Math.max(10, Math.min(canvas.width - ENEMY_WIDTH - 10, e.x));
                e.y += DIVE_SPEED;
                e.trail.push({ x: e.x, y: e.y });
                if (e.trail.length > 8) e.trail.shift();

                if (e.y > canvas.height + 40) {
                    e.state = 'returning';
                    e.y = -ENEMY_HEIGHT - 30;
                    e.x = 40 + Math.random() * (canvas.width - 80);
                    e.trail = [];
                    e.returnTimer = 0;
                }

                if (e.x < player.x + PLAYER_WIDTH && e.x + ENEMY_WIDTH > player.x &&
                    e.y < player.y + PLAYER_HEIGHT && e.y + ENEMY_HEIGHT > player.y) {
                    e.active = false;
                    createParticles(e.x + ENEMY_WIDTH/2, e.y + ENEMY_HEIGHT/2, ENEMY_COLORS[e.row % 4]);
                    AudioSys.enemyHit();
                    damagePlayer();
                }
            } else if (e.state === 'returning') {
                e.returnTimer++;
                const tx = getFormX(e.col);
                const ty = getFormY(e.row);
                e.x += (tx - e.x) * 0.09;
                e.y += (ty - e.y) * 0.09;
                
                if (Math.abs(e.x - tx) < 2 && Math.abs(e.y - ty) < 2) {
                    e.x = tx; e.y = ty; e.state = 'formation'; e.returnTimer = 0;
                } else if (e.returnTimer > 300) {
                    e.x = tx; e.y = ty; e.state = 'formation'; e.returnTimer = 0;
                }
            }
        }

        // --- Enemy fire timer ---
        enemyShootTimer--;
        if (enemyShootTimer <= 0) {
            enemyShoot();
            const minT = Math.max(70, 120 - (wave - 1) * 5);
            const maxT = Math.max(120, 180 - (wave - 1) * 5);
            enemyShootTimer = Math.floor(minT + Math.random() * (maxT - minT));
        }

        // --- Dive timer ---
        diveTimer--;
        if (diveTimer <= 0) {
            startDive();
            diveTimer = 300 + Math.floor(Math.random() * 180);
        }

        // --- Formation reaches player ---
        for (const e of activeEnemies) {
            if (e.state !== 'formation') continue;
            if (e.x < player.x + PLAYER_WIDTH && e.x + ENEMY_WIDTH > player.x &&
                e.y + ENEMY_HEIGHT > player.y && e.y < player.y + PLAYER_HEIGHT) {
                triggerGameOver(); return;
            }
            if (e.y + ENEMY_HEIGHT >= player.y) { triggerGameOver(); return; }
        }
    }
}

/* ============ GAME FLOW ============ */
function startGame() {
    AudioSys.init();
    AudioSys.stopUFO();
    score = 0; wave = 1; waveBaseSpeed = 1.0;
    lives = MAX_LIVES; invulnerability = 0;
    updateLivesUI();
    scoreEl.innerText = '0';
    bullets = []; enemyBullets = []; particles = [];
    powerups = []; ufo = null; ufoTimer = 600; boss = null;
    gameOverFlash = 0; waveTextTimer = 0; shootCooldown = 0;
    player.weapon = 'normal'; player.weaponTimer = 0;
    updateWeaponUI();
    mouseX = canvas.width / 2;
    player.x = mouseX - PLAYER_WIDTH / 2;
    createBunkers();
    initEnemies();
    gameActive = true;
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
}

function triggerGameOver() {
    if (!gameActive) return;
    gameActive = false;
    gameOverFlash = 45;
    AudioSys.gameOver();
    AudioSys.stopUFO();
    createParticles(player.x + PLAYER_WIDTH / 2, player.y + PLAYER_HEIGHT / 2, '#4caf50');
    createParticles(player.x + PLAYER_WIDTH / 2, player.y + PLAYER_HEIGHT / 2, '#ffeb3b');

    const isNewHigh = score > highScore;
    if (isNewHigh) {
        highScore = score;
        localStorage.setItem('spaceInvadersHigh', highScore);
        highScoreEl.innerText = highScore;
    }
    document.getElementById('finalScore').innerText = score;
    document.getElementById('finalWave').innerText = wave;
    document.getElementById('newHighScore').classList.toggle('hidden', !isNewHigh);
    setTimeout(() => gameOverScreen.classList.remove('hidden'), 400);
}

/* ============ LOOP ============ */
function gameLoop() {
    if (gameActive) update();
    draw();
    requestAnimationFrame(gameLoop);
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);
gameLoop();
</script>
